<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Voice Article Writer</title>
    <style>
        @font-face {
            font-family: 'Tamil039';
            src: url('https://cdn.lawtamil.in/font/Tamil039.woff2') format('woff2');
            font-weight: bold;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #0f172a; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            font-family: sans-serif;
        }
        
        .editor-container {
            width: 90%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 15px;
            padding: 0 5px;
        }

        .live-indicator {
            color: #22c55e;
            font-weight: bold;
        }

        /* கட்டுரை நிரம்பும் முக்கியப் பெட்டி */
        .article-box {
            width: 100%;
            height: 68vh;
            background-color: #1e293b;
            color: #f8fafc;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 25px;
            font-family: 'Tamil039', sans-serif;
            font-size: 24px;
            line-height: 1.8;
            box-sizing: border-box;
            resize: none;
            outline: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .article-box:focus {
            border-color: #3b82f6;
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover { background-color: #1d4ed8; }
        .btn-clear { background-color: #dc2626; }
        .btn-clear:hover { background-color: #b91c1c; }
    </style>
</head>
<body>

    <div class="editor-container">
        <div class="header-info">
            <div>நிலை: <span class="live-indicator">● மைக்ரோஃபோன் கேட்கிறது... பேசவும்</span></div>
            <div id="wordCount">மொத்த சொற்கள்: 0</div>
        </div>

        <textarea id="output" class="article-box" placeholder="நீங்கள் பேசுவது இங்கே முழு கட்டுரையாகத் தொகுக்கப்படும்..."></textarea>

        <div class="button-group">
            <button class="btn btn-clear" onclick="clearArticle()">அழி (Clear)</button>
            <button class="btn" onclick="copyArticle()">நகலெடு (Copy Text)</button>
        </div>
    </div>

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var roomID = urlParams.get("room") || "JurisprudenceTamil";
        var outputBox = document.getElementById("output");
        var wordCountElem = document.getElementById("wordCount");
        var lastFinalText = "";

        var socket = new WebSocket("wss://api.caption.ninja:443");

        socket.onopen = function () {
            socket.send(JSON.stringify({"join": roomID}));
        }

        socket.onmessage = function (event) {
            if (event.data) {
                var data = JSON.parse(event.data);
                
                // புதிய Final வாக்கியம் வரும்போது மட்டும் பெட்டியில் இணைக்கப்படும்
                if (data.final && data.final !== lastFinalText) {
                    lastFinalText = data.final;
                    appendSentence(data.final);
                }
            }
        };

        function appendSentence(text) {
            let currentContent = outputBox.value.trim();
            
            // ஏற்கனவே பெட்டியில் கண்டெண்ட் இருந்தால், ஒரு ஸ்பேஸ் விட்டு புதிய வரியை இணைக்கவும்
            if (currentContent.length > 0) {
                outputBox.value = currentContent + " " + text;
            } else {
                outputBox.value = text;
            }

            outputBox.scrollTop = outputBox.scrollHeight; // Auto-scroll to bottom
            updateCount();
        }

        outputBox.addEventListener('input', updateCount);

        function updateCount() {
            let text = outputBox.value.trim();
            let count = text === "" ? 0 : text.split(/\s+/).length;
            wordCountElem.innerText = "மொத்த சொற்கள்: " + count;
        }

        function copyArticle() {
            outputBox.select();
            navigator.clipboard.writeText(outputBox.value);
            alert("கட்டுரை Copy செய்யப்பட்டது!");
        }

        function clearArticle() {
            if(confirm("எழுதிய கட்டுரையை முழுமையாக அழிக்க விரும்புகிறீர்களா?")) {
                outputBox.value = "";
                updateCount();
            }
        }

        socket.onclose = function () {
            setTimeout(function() { window.location.reload(true); }, 1000);
        };
    </script>
</body>
</html>
