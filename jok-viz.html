<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil Live VTuber - Pure Monolith Pro</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; 
        }
        .anim-section { 
            width: 100%; height: 100%; position: relative; 
        }
        
        #joker-stage {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            will-change: transform;
        }
    </style>
</head>
<body>

    <div class="anim-section">
        <canvas id="joker-stage" width="420" height="480"></canvas>
    </div>
    
    <script type="module">
        import { VDONinjaClient } from './main.js'; // உங்கள் சர்வரில் VDO.Ninja Core SDK இருக்கும் சரியான பாதை

        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';

        let analyser, dataArray; 
        let audioCtx; let lastActiveTime = Date.now(); 

        const jokerCanvas = document.getElementById('joker-stage');
        const jokerCtx = jokerCanvas.getContext('2d');

        const bgImg = new Image(); const fgImg = new Image();
        function loadWithFallback(imgObj, srcList) {
            let i = 0; imgObj.onerror = () => { i++; if (i < srcList.length) imgObj.src = srcList[i]; };
            imgObj.src = srcList[0];
        }
        loadWithFallback(bgImg, ['./joker.png', './joker.jpg', './joker.PNG', './joker.JPG']);
        loadWithFallback(fgImg, ['./joker1.png', './joker1.PNG']);

        let contourNormals = []; let contourScanned = false;
        function safeScanContour() {
            if (contourScanned || !fgImg.complete || fgImg.naturalWidth === 0) return;
            try {
                const off = document.createElement('canvas'); off.width = 420; off.height = 480; 
                const octx = off.getContext('2d', { willReadFrequently: true });
                octx.drawImage(fgImg, 0, 0, fgImg.naturalWidth, fgImg.naturalHeight, 60, 40, 300, 340);
                const data = octx.getImageData(0, 0, 420, 480).data;
                const cx = 210, cy = 210; const rays = 75; contourNormals = [];
                for (let i = 0; i < rays; i++) {
                    const angle = (i / rays) * (Math.PI * 2);
                    if (angle > Math.PI * 0.35 && angle < Math.PI * 0.65) continue;
                    const nx = Math.cos(angle); const ny = Math.sin(angle);
                    for (let r = 165; r > 15; r--) {
                        const px = Math.round(cx + nx * r); const py = Math.round(cy + ny * r);
                        if (px >= 0 && px < 420 && py >= 0 && py < 480) {
                            if (data[(py * 420 + px) * 4 + 3] > 40) { contourNormals.push({ x: px, y: py, nx: nx, ny: ny }); break; }
                        }
                    }
                }
                contourScanned = true;
            } catch (e) { contourScanned = true; }
        }

        const AudioBlendshapeNet = {
            predict: function(fft) {
                let x = []; for(let i=0; i<16; i++) { x[i] = Math.max(0, (fft[i] || 0) - 78) / 177; }
                const f1Vowel = (x[1]*1.0 + x[2]*1.5 + x[3]*1.8 + x[4]*1.2 + x[5]*0.7) / 6.2;
                const f2Sibilant = (x[9]*0.8 + x[11]*1.4 + x[13]*1.7 + x[15]*1.1) / 5.0;
                let jawOpen = Math.min(1.0, Math.max(0.0, (f1Vowel * 1.7) - 0.05));
                let mouthStretch = Math.min(1.0, Math.max(0.0, (f2Sibilant * 1.6) - (f1Vowel * 0.4)));
                return { jawOpen, mouthStretch };
            }
        };

        let currJaw = 0, targetJaw = 0; let currSmile = 0, targetSmile = 0;
        let faceAlpha = 0, targetFaceAlpha = 0; let isBlinking = false;

        function startAutonomousBlink() {
            isBlinking = true; setTimeout(() => { isBlinking = false; }, 120);
            setTimeout(startAutonomousBlink, Math.random() * 3500 + 2000);
        }
        startAutonomousBlink();

        // --- 2. THE HUMANIZER DSP KERNEL (±8% Jitter) ---
        const pitchWorkletCode = `
    class TrueGranularEngine extends AudioWorkletProcessor {
        constructor() {
            super();
            this.GRAIN = 1024; // 21ms Hanning Window
            this.buffer = new Float32Array(this.GRAIN * 4);
            this.wPtr = 0;

            // இரண்டு டேப் ஹெட்கள் (ஒன்று எழும்போது மற்றொன்று அமுங்கும்)
            this.headA = { pos: 0, age: 0 };
            this.headB = { pos: 0, age: this.GRAIN / 2 }; 

            this.pitch = 0.817; // உங்களின் கோல்டன் ரேஷியோ
        }

        getSample(ptr) {
            let fl = Math.floor(ptr);
            let fr = ptr - fl;
            let s0 = this.buffer[fl % (this.GRAIN * 4)];
            let s1 = this.buffer[(fl + 1) % (this.GRAIN * 4)];
            return s0 + (s1 - s0) * fr; // வெண்ணெய் போன்ற Linear Interpolation
        }

        process(inputs, outputs) {
            const input = inputs[0][0];
            const outputL = outputs[0][0];
            const outputR = outputs[0][1];
            if (!input || !outputL) return true;

            const N = this.GRAIN;
            const maxBuf = N * 4;

            for (let i = 0; i < input.length; i++) {
                // 1. இன்புட்டை எழுதுகிறோம்
                this.buffer[this.wPtr] = input[i];
                this.wPtr = (this.wPtr + 1) % maxBuf;

                // 2. Hanning Bell-Curve விசை (0.0 -> 1.0 -> 0.0)
                let winA = 0.5 * (1 - Math.cos((2 * Math.PI * this.headA.age) / N));
                let winB = 0.5 * (1 - Math.cos((2 * Math.PI * this.headB.age) / N));

                // 3. இரண்டு ஹெட்களையும் வாசித்து மிக்ஸ் செய்கிறோம்
                let sample = (this.getSample(this.headA.pos) * winA) + 
                             (this.getSample(this.headB.pos) * winB);

                outputL[i] = sample;
                if (outputR) outputR[i] = sample;

                // 4. வயதைக் கூட்டுகிறோம்
                this.headA.age++;
                this.headB.age++;

                this.headA.pos = (this.headA.pos + this.pitch) % maxBuf;
                this.headB.pos = (this.headB.pos + this.pitch) % maxBuf;

                // 5. ஒரு ஹெட் அதன் ஆயுளை (N) முடிக்கும்போது, சத்தமில்லாமல் '0' வால்யூமில் ரீசெட் ஆகிறது
                if (this.headA.age >= N) {
                    this.headA.age = 0;
                    this.headA.pos = (this.wPtr - N + maxBuf) % maxBuf;
                }
                if (this.headB.age >= N) {
                    this.headB.age = 0;
                    this.headB.pos = (this.wPtr - N + maxBuf) % maxBuf;
                }
            }
            return true;
        }
    }
    registerProcessor('joker-voice-engine', TrueGranularEngine);
    `;

        const connectedTracks = new Set(); 

        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser(); analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.3; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // --- NATIVE ES6 CLIENT INITIALIZATION ---
            const ninjaClient = new VDONinjaClient({
                room: roomName,
                autostart: true,
                stereo: true,
                proaudio: true,
                muted: true // அசல் குரல் ஒலிக்காமல் தடுத்து, DSP Worklet வழியே மட்டுமே அவுட்புட் தருகிறோம்
            });

            ninjaClient.on('onTrack', async (track) => {
                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                    connectedTracks.add(track.id);
                    try {
                        if (audioCtx.state === 'suspended') audioCtx.resume();
                        const cleanStream = new MediaStream([track]);
                        const rawMic = audioCtx.createMediaStreamSource(cleanStream);

                        const blob = new Blob([pitchWorkletCode], { type: 'application/javascript' });
                        await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
                        const pitchConverter = new AudioWorkletNode(audioCtx, 'joker-voice-engine');

                        const chestRumble = audioCtx.createBiquadFilter();
                        chestRumble.type = 'lowshelf'; chestRumble.frequency.value = 160; chestRumble.gain.value = 6.0; 

                        rawMic.connect(chestRumble);
                        chestRumble.connect(pitchConverter);
                        pitchConverter.connect(analyser);
                        analyser.connect(audioCtx.destination); 
                    } catch(err) {}
                }
            });

            ninjaClient.start();

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderStage();
        }

        const renderStage = () => {
            requestAnimationFrame(renderStage);
            if (!contourScanned && fgImg.complete && fgImg.naturalWidth > 0) safeScanContour();

            let avgVol = 0; let blendshapes = { jawOpen: 0, mouthStretch: 0 };
            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let totalVolume = 0; for(let i=0; i<25; i++) { totalVolume += Math.max(0, (dataArray[i] || 0) - 82); }
                avgVol = totalVolume / 25; blendshapes = AudioBlendshapeNet.predict(dataArray);
            }

            if (avgVol > 8) { 
                lastActiveTime = Date.now(); targetFaceAlpha = 1.0; 
                targetJaw = blendshapes.jawOpen * 22; targetSmile = blendshapes.mouthStretch * 12; 
            } else {
                targetJaw = 0; targetSmile = 0;
                if (Date.now() - lastActiveTime > 1200) targetFaceAlpha = 0.0; 
            }

            if (bgImg.complete && fgImg.complete && bgImg.naturalHeight > 0 && fgImg.naturalHeight > 0) {
                currJaw += (targetJaw - currJaw) * 0.32; currSmile += (targetSmile - currSmile) * 0.28;
                faceAlpha += (targetFaceAlpha - faceAlpha) * 0.14; 
                jokerCtx.clearRect(0, 0, 420, 480);

                jokerCtx.globalAlpha = 1.0;
                jokerCtx.drawImage(bgImg, 0, 0, bgImg.naturalWidth, bgImg.naturalHeight, 60, 40, 300, 340);

                if (faceAlpha > 0.005) {
                    jokerCtx.globalAlpha = faceAlpha;
                    if (contourNormals.length > 0 && avgVol > 1) {
                        jokerCtx.save(); jokerCtx.lineWidth = 3.5; jokerCtx.lineCap = 'round';
                        jokerCtx.shadowColor = '#ff1a1a'; jokerCtx.shadowBlur = 12;
                        const stepBin = Math.floor((dataArray.length * 0.6) / contourNormals.length);
                        contourNormals.forEach((pt, i) => {
                            const bin = i * stepBin; const pwr = Math.max(0, (dataArray[bin] || 0) - 85) * 0.25;
                            if (pwr > 1) {
                                jokerCtx.strokeStyle = (i % 2 === 0) ? '#ff1a1a' : '#ff4d4d';
                                jokerCtx.beginPath(); jokerCtx.moveTo(pt.x - (pt.nx * 2), pt.y - (pt.ny * 2));
                                jokerCtx.lineTo(pt.x + (pt.nx * pwr), pt.y + (pt.ny * pwr)); jokerCtx.stroke();
                            }
                        });
                        jokerCtx.restore();
                    }
                    const natW = fgImg.naturalWidth; const natH = fgImg.naturalHeight; const scale = 340 / natH; 
                    const sTop = natH * 0.585; const sBot = natH * 0.625; const sRubberH = sBot - sTop; 
                    const dTopH = sTop * scale; const dRubberH = (sRubberH * scale) + currJaw; 
                    const dBotY = dTopH + dRubberH; const dBotH = (natH - sBot) * scale;
                    const stretchX = 60 - (currSmile * 0.5); const stretchW = 300 + currSmile;
                    const botJawX = 60 - (currSmile * 0.25);

                    jokerCtx.drawImage(fgImg, 0, 0, natW, sTop,  60, 40, 300, dTopH);
                    jokerCtx.drawImage(fgImg, 0, sTop, natW, sRubberH,  stretchX, 40 + dTopH, stretchW, dRubberH);
                    jokerCtx.drawImage(fgImg, 0, sBot, natW, natH - sBot,  botJawX, 40 + dBotY, 300 + (currSmile*0.5), dBotH);
                }
                jokerCtx.globalAlpha = 1.0; 
                if (isBlinking) {
                    jokerCtx.fillStyle = "#cbd0d3"; 
                    jokerCtx.beginPath(); jokerCtx.ellipse(184.5, 179.4, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                    jokerCtx.beginPath(); jokerCtx.ellipse(235.5, 179.4, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                }
            }
        };
        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
