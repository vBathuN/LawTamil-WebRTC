<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil Master Visualizer Pro - Live2D Rig</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; 
        }
        
        .anim-section { 
            width: 100%; height: 100%; 
            position: relative; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box;
        }
        
        #justice-glow {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; border-radius: 50%; 
            background: radial-gradient(circle, rgba(255, 20, 20, 0.85) 0%, rgba(255, 20, 20, 0) 60%), radial-gradient(circle, rgba(255, 215, 0, 0.5) 10%, rgba(255, 215, 0, 0) 80%);
            filter: blur(6px); box-shadow: 0 0 50px rgba(255, 10, 10, 0.95); z-index: 1; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; 
        }

        /* --- THE MASTER LIVE2D STAGE --- */
        #joker-stage {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 350px; z-index: 5; pointer-events: none;
            opacity: 0; transition: opacity 0.4s ease-in-out;
            will-change: transform;
        }

        #vdo-engine { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>

    <div class="anim-section">
        <div id="justice-glow"></div> 
        <canvas id="joker-stage" width="300" height="350"></canvas>
    </div>
    
    <iframe id="vdo-engine" allow="autoplay; microphone"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';
        document.getElementById('vdo-engine').src = `./index.html?scene&room=${roomName}&autostart`;

        let analyser, dataArray; 
        let audioCtx; let lastActiveTime = Date.now(); 
        
        const glowDiv = document.getElementById('justice-glow');
        const jokerCanvas = document.getElementById('joker-stage');
        const jokerCtx = jokerCanvas.getContext('2d');

        // --- PURE SINGLE PNG ASSET ---
        const jokerImg = new Image();
        jokerImg.src = './joker.png'; // உன் அசல் Esports படம் (remove.bg செய்தது)

        // இயற்பியல் லெர்ப் (Lerp) மாறிகள்
        let currJaw = 0, targetJaw = 0;
        let isBlinking = false;

        function startBlink() {
            isBlinking = true;
            setTimeout(() => { isBlinking = false; }, 120);
            setTimeout(startBlink, Math.random() * 3500 + 2000);
        }
        jokerImg.onload = () => { startBlink(); };

        const connectedTracks = new Set(); 

        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.3; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const iframe = document.getElementById('vdo-engine');
            setInterval(() => {
                try {
                    const iframeWin = iframe.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            pc.addEventListener('track', (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    connectedTracks.add(track.id);
                                    try {
                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        const cleanStream = new MediaStream([track]);
                                        source = audioCtx.createMediaStreamSource(cleanStream);
                                        source.connect(analyser); 
                                    } catch(err) {}
                                }
                            });
                            return pc;
                        };
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 10);

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderVisualizer();
        }

        const renderVisualizer = () => {
            if (!analyser) return; 
            requestAnimationFrame(renderVisualizer);
            analyser.getByteFrequencyData(dataArray);
            
            let totalVolume = 0;
            for(let i=0; i<25; i++) { totalVolume += Math.max(0, (dataArray[i] || 0) - 82); }
            const avgVol = totalVolume / 25;

            if (avgVol > 8) { 
                lastActiveTime = Date.now(); 
                jokerCanvas.style.opacity = "1";
                if (glowDiv) glowDiv.style.opacity = Math.min(1, avgVol / 60);

                // சத்தத்தை 0 முதல் 24px தாடை இறக்கமாக மாற்றுதல்
                targetJaw = Math.min(24, Math.max(0, (avgVol - 8) * 0.65));
            } else {
                targetJaw = 0;
                if (Date.now() - lastActiveTime > 2000) {
                    jokerCanvas.style.opacity = "0";
                    if (glowDiv) glowDiv.style.opacity = "0";
                }
            }

            // =========================================================================
            // --- THE 3-TIER ANATOMICAL RIG & ORAL EQUALIZER ---
            // =========================================================================
            if (jokerImg.complete && jokerImg.naturalHeight > 0) {
                
                currJaw += (targetJaw - currJaw) * 0.35; // மென்மையான தாடை சறுக்கம்

                jokerCtx.clearRect(0, 0, 300, 350);

                const natW = jokerImg.naturalWidth;
                const natH = jokerImg.naturalHeight;
                const scale = 340 / natH; 

                // --- 3 மண்டலங்களை வெட்டும் Y-புள்ளிகள் ---
                const sTeethLine = natH * 0.585; // மேல் பற்களின் விளிம்பு
                const sChinTip   = natH * 0.685; // வெள்ளை முக்கோணத் தாடையின் மிகக் கீழ் நுனி!

                const hHead  = sTeethLine * scale;
                const hJaw   = (sChinTip - sTeethLine) * scale;
                const hTorso = (natH - sChinTip) * scale;

                const yTorsoFixed = sChinTip * scale; // உடல் கல்லுப்போல நிற்கும் இடம்

                // ---------------------------------------------------------------------
                // அடுக்கு 1: அசைவில்லாத உடல் (Torso/Collar - at Fixed Y)
                // ---------------------------------------------------------------------
                jokerCtx.drawImage(
                    jokerImg, 
                    0, sChinTip, natW, natH - sChinTip, 
                    0, yTorsoFixed, 300, hTorso
                );

                // ---------------------------------------------------------------------
                // அடுக்கு 2: தொண்டைக்குள் அதிரும் Equalizer (Oral Equalizer)
                // ---------------------------------------------------------------------
                if (currJaw > 1) {
                    const mouthLeft = 300 * 0.32;
                    const mouthWidth = 300 * 0.36;

                    // இருண்ட தொண்டைக் குழி
                    jokerCtx.fillStyle = "#0a0102";
                    jokerCtx.fillRect(mouthLeft - 5, hHead, mouthWidth + 10, currJaw);

                    // பற்களுக்கு நடுவில் ஆடும் 20 சிவப்பு/ஆரஞ்சு ஆடியோ கம்பிகள்!
                    const stepX = mouthWidth / 20;
                    for (let b = 0; b < 20; b++) {
                        const bin = Math.floor(b * (dataArray.length / 40));
                        const pwr = (dataArray[bin] || 0) / 255;
                        const barH = Math.min(currJaw * 0.85, currJaw * pwr); // வாய் திறப்புக்குள் கச்சிதமாக அடங்கும்

                        jokerCtx.fillStyle = (b % 2 === 0) ? "#ff1a1a" : "#ff9900";
                        jokerCtx.fillRect(mouthLeft + (b * stepX), hHead + ((currJaw - barH)/2), stepX - 1, barH);
                    }
                }

                // ---------------------------------------------------------------------
                // அடுக்கு 3: அசையும் தாடை (Shifted down over the static collar)
                // ---------------------------------------------------------------------
                jokerCtx.drawImage(
                    jokerImg, 
                    0, sTeethLine, natW, sChinTip - sTeethLine, 
                    0, hHead + currJaw, 300, hJaw // 'currJaw' அளவுக்குக் கீழே இறங்கி உடலை மறைக்கும்!
                );

                // ---------------------------------------------------------------------
                // அடுக்கு 4: மேல் மண்டை (Fixed Top)
                // ---------------------------------------------------------------------
                jokerCtx.drawImage(
                    jokerImg, 
                    0, 0, natW, sTeethLine, 
                    0, 0, 300, hHead
                );

                // --- கண் சிமிட்டல் ---
                if (isBlinking) {
                    jokerCtx.fillStyle = "#cbd0d3"; 
                    jokerCtx.beginPath(); jokerCtx.ellipse(300 * 0.415, 340 * 0.41, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                    jokerCtx.beginPath(); jokerCtx.ellipse(300 * 0.585, 340 * 0.41, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                }
            }
        };

        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
