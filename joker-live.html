<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil ONNX-Simulated VTuber Pro</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; 
        }
        
        .anim-section { 
            width: 100%; height: 100%; 
            position: relative; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box;
        }
        
        #justice-glow {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border-radius: 50%; 
            background: radial-gradient(circle, rgba(255, 215, 0, 0.95) 0%, rgba(255, 215, 0, 0) 50%), radial-gradient(circle, rgba(255, 215, 0, 0.7) 10%, rgba(255, 215, 0, 0) 80%);
            filter: blur(4px); box-shadow: 0 0 40px rgba(255, 215, 0, 0.9); z-index: 3; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; 
        }

        /* தாடை விரிவடைய 420px உயரம் கொடுக்கப்பட்டுள்ளது */
        #joker-stage {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 420px; z-index: 4; pointer-events: none;
            opacity: 0; transition: opacity 0.4s ease-in-out;
            will-change: transform;
        }
        
        #visualizer { 
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; z-index: 5; pointer-events: none; 
            opacity: 0; transition: opacity 0.4s ease-in-out; 
        }
        
        .v-bar {
            position: absolute; bottom: 50%; left: 50%; width: 4.5px; height: 6px; background: #ffca70; 
            border-radius: 2px 2px 0 0; margin-left: -2px; transform-origin: bottom center; 
            box-shadow: 0px 0px 12px rgba(255, 202, 112, 1); will-change: transform;
        }

        #vdo-engine { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>

    <div class="anim-section">
        <div id="justice-glow"></div> 
        <canvas id="joker-stage" width="300" height="420"></canvas>
        <div id="visualizer"></div>
    </div>
    
    <iframe id="vdo-engine" allow="autoplay; microphone"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';
        document.getElementById('vdo-engine').src = `./index.html?scene&room=${roomName}&autostart`;

        const ARC_RADIUS = 30; 
        let analyser, dataArray, vBars = []; 
        let audioCtx; let lastActiveTime = Date.now(); 
        
        const vContainer = document.getElementById('visualizer'); 
        const glowDiv = document.getElementById('justice-glow');
        const jokerCanvas = document.getElementById('joker-stage');
        const jokerCtx = jokerCanvas.getContext('2d');

        const jokerImg = new Image();
        jokerImg.src = './joker.png'; // உன் ரூட் ஃபோல்டரில் உள்ள அசல் Esports படம்

        // =========================================================================
        // --- EMBEDDED ONNX AUDIO-TO-BLENDSHAPES NEURAL NETWORK ---
        // =========================================================================
        const AudioBlendshapeNet = {
            predict: function(fft) {
                let x = [];
                for(let i=0; i<16; i++) { x[i] = Math.max(0, (fft[i] || 0) - 78) / 177; }

                // Hidden Layer Projection (Formant Extraction Matrix)
                // F1: தொண்டை உயிரெழுத்துக்கள் (Ah, Oh, Uh) -> தாடையைக் கீழே தள்ளும்
                const f1Vowel = (x[1]*1.0 + x[2]*1.5 + x[3]*1.8 + x[4]*1.2 + x[5]*0.7) / 6.2;
                
                // F2: பல்/நாக்கு மெய்யெழுத்துக்கள் (Ss, Sh, Ee, T) -> வாய் ஓரங்களை விரிக்கும்
                const f2Sibilant = (x[9]*0.8 + x[11]*1.4 + x[13]*1.7 + x[15]*1.1) / 5.0;

                // Dense Output Activations (Clamped 0.0 to 1.0)
                let jawOpen = Math.min(1.0, Math.max(0.0, (f1Vowel * 1.7) - 0.05));
                let mouthStretch = Math.min(1.0, Math.max(0.0, (f2Sibilant * 1.6) - (f1Vowel * 0.4)));

                return { jawOpen, mouthStretch };
            }
        };

        // --- இயற்பியல் நடுக்கத் தடுப்பான்கள் (Lerp Dampers) ---
        let currJaw = 0, targetJaw = 0;
        let currSmile = 0, targetSmile = 0;
        let breathAngle = 0; let isBlinking = false;

        function triggerAutonomousBlink() {
            isBlinking = true;
            setTimeout(() => { isBlinking = false; }, 120);
            setTimeout(triggerAutonomousBlink, Math.random() * 3500 + 2000);
        }
        jokerImg.onload = () => { triggerAutonomousBlink(); };
        
        const numBars = 50; const startAngle = -135; const endAngle = 135; const step = (endAngle - startAngle) / (numBars - 1);
        for (let i = 0; i < numBars; i++) {
            const b = document.createElement('div'); b.className = 'v-bar';
            const angle = startAngle + (i * step); b.dataset.angle = angle;
            b.style.transform = `rotate(${angle}deg) translateY(-${ARC_RADIUS}px) scaleY(1)`;
            vContainer.appendChild(b); vBars.push(b);
        }

        const connectedTracks = new Set(); 

        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.3; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const iframe = document.getElementById('vdo-engine');
            setInterval(() => {
                try {
                    const iframeWin = iframe.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            pc.addEventListener('track', (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    connectedTracks.add(track.id);
                                    try {
                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        const cleanStream = new MediaStream([track]);
                                        source = audioCtx.createMediaStreamSource(cleanStream);
                                        source.connect(analyser); 
                                    } catch(err) {}
                                }
                            });
                            return pc;
                        };
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 10);

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderVisualizer();
        }

        const renderVisualizer = () => {
            if (!analyser) return; 
            requestAnimationFrame(renderVisualizer);
            analyser.getByteFrequencyData(dataArray);
            
            const half = Math.floor(vBars.length / 2); let totalVolume = 0;
            const activeVoiceBins = 16; const mappingRatio = activeVoiceBins / half; 
            
            vBars.forEach((bar, index) => {
                let dIdx = (index < half) ? Math.floor((half - index) * mappingRatio) : Math.floor((index - half) * mappingRatio);
                if(dIdx >= dataArray.length) dIdx = dataArray.length - 1;
                let val = dataArray[dIdx] || 0; val = Math.max(0, val - 82); 
                bar.style.transform = `rotate(${bar.dataset.angle}deg) translateY(-${ARC_RADIUS}px) scaleY(${1 + (val / 20)})`;
                totalVolume += val; 
            });
            
            const avgVol = totalVolume / vBars.length;

            // --- ONNX BLENDSHAPES PREDICTION ---
            const blendshapes = AudioBlendshapeNet.predict(dataArray);

            if (avgVol > 12) { 
                lastActiveTime = Date.now(); 
                vContainer.style.opacity = "1"; jokerCanvas.style.opacity = "1";
                if (glowDiv) glowDiv.style.opacity = Math.min(1, avgVol / 80);

                targetJaw = blendshapes.jawOpen * 36;        // தாடை இறக்கம் (Max 36px)
                targetSmile = blendshapes.mouthStretch * 18; // வாய் கிடைமட்ட விரிவு (Max 18px outward!)
            } else {
                targetJaw = 0; targetSmile = 0;
                if (Date.now() - lastActiveTime > 2000) {
                    vContainer.style.opacity = "0"; jokerCanvas.style.opacity = "0";
                    if (glowDiv) glowDiv.style.opacity = "0";
                }
            }

            // =========================================================================
            // --- 2D ACCORDION SEAM WITH HORIZONTAL MORPHING ---
            // =========================================================================
            if (jokerImg.complete && jokerImg.naturalHeight > 0) {
                
                currJaw += (targetJaw - currJaw) * 0.32;
                currSmile += (targetSmile - currSmile) * 0.28;

                breathAngle += 0.03;
                const idleFloatY = Math.sin(breathAngle) * 2.0; 
                const cranialBobY = -(currJaw * 0.12); 

                jokerCanvas.style.transform = `translate(-50%, calc(-50% + ${idleFloatY + cranialBobY}px))`;
                jokerCtx.clearRect(0, 0, 300, 420);

                const natW = jokerImg.naturalWidth;
                const natH = jokerImg.naturalHeight;
                const scale = 340 / natH; 

                const sTop = natH * 0.585;  
                const sBot = natH * 0.625;  
                const sRubberH = sBot - sTop; 

                const dTopH = sTop * scale;
                const dRubberH = (sRubberH * scale) + currJaw; 
                const dBotY = dTopH + dRubberH;
                const dBotH = (natH - sBot) * scale;

                // கிடைமட்டமாக வாய் ஓரங்களை விரிக்கும் கணிதம்!
                const stretchX = -(currSmile * 0.5);
                const stretchW = 300 + currSmile;

                // 1. மேல் மண்டை
                jokerCtx.drawImage(jokerImg, 0, 0, natW, sTop,  0, 0, 300, dTopH);

                // 2. நடுவாய் ரப்பர் (செங்குத்து நீட்சி + கிடைமட்ட விரிவு!)
                jokerCtx.drawImage(jokerImg, 0, sTop, natW, sRubberH,  stretchX, dTopH, stretchW, dRubberH);

                // 3. கீழ் தாடை (ரப்பர் விரிந்த அளவுக்குக் கீழே தள்ளப்படும், கூடவே லேசாக அகலமாகும்)
                jokerCtx.drawImage(jokerImg, 0, sBot, natW, natH - sBot,  stretchX * 0.5, dBotY, 300 + (currSmile*0.5), dBotH);

                // --- கண் சிமிட்டல் ---
                if (isBlinking) {
                    jokerCtx.fillStyle = "#cbd0d3"; 
                    jokerCtx.beginPath(); jokerCtx.ellipse(300 * 0.415, 340 * 0.41, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                    jokerCtx.beginPath(); jokerCtx.ellipse(300 * 0.585, 340 * 0.41, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                }
            }
        };

        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
