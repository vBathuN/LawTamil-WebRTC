<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil Live VTuber - Pure Original Edition</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; 
        }
        .anim-section { 
            width: 100%; height: 100%; position: relative; 
            display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box;
        }
        #justice-glow {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border-radius: 50%; 
            background: radial-gradient(circle, rgba(255, 215, 0, 0.95) 0%, rgba(255, 215, 0, 0) 50%), radial-gradient(circle, rgba(255, 215, 0, 0.7) 10%, rgba(255, 215, 0, 0) 80%);
            filter: blur(4px); box-shadow: 0 0 40px rgba(255, 215, 0, 0.9); z-index: 3; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; 
        }
        #joker-stage {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 420px; z-index: 4; pointer-events: none; will-change: transform;
        }
        #vdo-engine { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>

    <div class="anim-section">
        <div id="justice-glow"></div> 
        <canvas id="joker-stage" width="300" height="420"></canvas>
    </div>
    
    <iframe id="vdo-engine" allow="autoplay; microphone"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';
        document.getElementById('vdo-engine').src = `./index.html?scene&room=${roomName}&autostart&stereo`;

        let analyser, dataArray; 
        let audioCtx; let lastActiveTime = Date.now(); 
        
        const glowDiv = document.getElementById('justice-glow');
        const jokerCanvas = document.getElementById('joker-stage');
        const jokerCtx = jokerCanvas.getContext('2d');

        // --- 1. SMART ASSET LOADER ---
        const bgImg = new Image();
        const fgImg = new Image();

        function loadWithFallback(imgObj, srcList) {
            let i = 0;
            imgObj.onerror = () => { i++; if (i < srcList.length) imgObj.src = srcList[i]; };
            imgObj.src = srcList[0];
        }

        loadWithFallback(bgImg, ['./joker.png', './joker.jpg', './joker.PNG', './joker.JPG']);
        loadWithFallback(fgImg, ['./joker1.png', './joker1.PNG']);

        // --- 2. VECTOR CONTOUR SCANNER ---
        let contourNormals = []; let contourScanned = false;

        function safeScanContour() {
            if (contourScanned || !fgImg.complete || fgImg.naturalWidth === 0) return;
            try {
                const off = document.createElement('canvas'); off.width = 300; off.height = 340; 
                const octx = off.getContext('2d', { willReadFrequently: true });
                octx.drawImage(fgImg, 0, 0, fgImg.naturalWidth, fgImg.naturalHeight, 0, 0, 300, 340);
                const data = octx.getImageData(0, 0, 300, 340).data;

                const cx = 150, cy = 170; const rays = 75; contourNormals = [];
                for (let i = 0; i < rays; i++) {
                    const angle = (i / rays) * (Math.PI * 2);
                    if (angle > Math.PI * 0.35 && angle < Math.PI * 0.65) continue;
                    const nx = Math.cos(angle); const ny = Math.sin(angle);
                    for (let r = 165; r > 15; r--) {
                        const px = Math.round(cx + nx * r); const py = Math.round(cy + ny * r);
                        if (px >= 0 && px < 300 && py >= 0 && py < 340) {
                            if (data[(py * 300 + px) * 4 + 3] > 40) { 
                                contourNormals.push({ x: px, y: py, nx: nx, ny: ny }); break;
                            }
                        }
                    }
                }
                contourScanned = true;
            } catch (e) { contourScanned = true; }
        }

        // --- 3. ONNX NEURAL ENGINE ---
        const AudioBlendshapeNet = {
            predict: function(fft) {
                let x = [];
                for(let i=0; i<16; i++) { x[i] = Math.max(0, (fft[i] || 0) - 78) / 177; }
                const f1Vowel = (x[1]*1.0 + x[2]*1.5 + x[3]*1.8 + x[4]*1.2 + x[5]*0.7) / 6.2;
                const f2Sibilant = (x[9]*0.8 + x[11]*1.4 + x[13]*1.7 + x[15]*1.1) / 5.0;
                let jawOpen = Math.min(1.0, Math.max(0.0, (f1Vowel * 1.7) - 0.05));
                let mouthStretch = Math.min(1.0, Math.max(0.0, (f2Sibilant * 1.6) - (f1Vowel * 0.4)));
                return { jawOpen, mouthStretch };
            }
        };

        let currJaw = 0, targetJaw = 0;
        let currSmile = 0, targetSmile = 0;
        let faceAlpha = 0, targetFaceAlpha = 0; 
        let breathAngle = 0; let isBlinking = false;

        function startAutonomousBlink() {
            isBlinking = true; setTimeout(() => { isBlinking = false; }, 120);
            setTimeout(startAutonomousBlink, Math.random() * 3500 + 2000);
        }
        startAutonomousBlink();

        // --- 4. WEBRTC HOOK ---
        const connectedTracks = new Set(); 
        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser(); analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.3; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const iframe = document.getElementById('vdo-engine');
            setInterval(() => {
                try {
                    const iframeWin = iframe.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            pc.addEventListener('track', (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    connectedTracks.add(track.id);
                                    try {
                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        const cleanStream = new MediaStream([track]);
                                        const source = audioCtx.createMediaStreamSource(cleanStream);
                                        source.connect(analyser); 
                                    } catch(err) {}
                                }
                            });
                            return pc;
                        };
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 500);

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderStage();
        }

        // --- 5. MASTER RENDER STAGE (PURE ORIGINAL MATH) ---
        const renderStage = () => {
            requestAnimationFrame(renderStage);
            if (!contourScanned && fgImg.complete && fgImg.naturalWidth > 0) safeScanContour();

            let avgVol = 0; let blendshapes = { jawOpen: 0, mouthStretch: 0 };

            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let totalVolume = 0; for(let i=0; i<25; i++) { totalVolume += Math.max(0, (dataArray[i] || 0) - 82); }
                avgVol = totalVolume / 25; blendshapes = AudioBlendshapeNet.predict(dataArray);
            }

            if (avgVol > 8) { 
                lastActiveTime = Date.now(); targetFaceAlpha = 1.0; 
                if (glowDiv) glowDiv.style.opacity = Math.min(1, avgVol / 80);
                targetJaw = blendshapes.jawOpen * 24; targetSmile = blendshapes.mouthStretch * 18; 
            } else {
                targetJaw = 0; targetSmile = 0;
                if (Date.now() - lastActiveTime > 1200) { targetFaceAlpha = 0.0; if (glowDiv) glowDiv.style.opacity = "0"; }
            }

            if (bgImg.complete && fgImg.complete && bgImg.naturalHeight > 0 && fgImg.naturalHeight > 0) {
                
                currJaw += (targetJaw - currJaw) * 0.32; currSmile += (targetSmile - currSmile) * 0.28;
                faceAlpha += (targetFaceAlpha - faceAlpha) * 0.14; 

                jokerCanvas.style.transform = 'translate(-50%, -50%)';
                jokerCtx.clearRect(0, 0, 300, 420);

                // [LAYER 0] - நிரந்தரப் பின்னணி (அமைதியாக இருக்கும்போது கம்பீரமாகத் தெரியும் அசல் படம்)
                jokerCtx.globalAlpha = 1.0;
                jokerCtx.drawImage(bgImg, 0, 0, bgImg.naturalWidth, bgImg.naturalHeight, 0, 0, 300, 340);

                // [LAYERS 1 & 2] - பேசும்போது மட்டும் மேலெழும் முகம்
                if (faceAlpha > 0.005) {
                    jokerCtx.globalAlpha = faceAlpha;

                    // --- அசல் விஷுவலைசர் (முழுச் சிவப்பு மட்டும்) ---
                    if (contourNormals.length > 0 && avgVol > 1) {
                        jokerCtx.save();
                        jokerCtx.lineWidth = 3.5; jokerCtx.lineCap = 'round';
                        jokerCtx.shadowColor = '#ff1a1a'; jokerCtx.shadowBlur = 12;
                        const stepBin = Math.floor((dataArray.length * 0.6) / contourNormals.length);
                        contourNormals.forEach((pt, i) => {
                            const bin = i * stepBin; const pwr = Math.max(0, (dataArray[bin] || 0) - 85) * 0.25;
                            if (pwr > 1) {
                                jokerCtx.strokeStyle = (i % 2 === 0) ? '#ff1a1a' : '#ff4d4d'; // Pure Red!
                                jokerCtx.beginPath();
                                jokerCtx.moveTo(pt.x - (pt.nx * 2), pt.y - (pt.ny * 2));
                                jokerCtx.lineTo(pt.x + (pt.nx * pwr), pt.y + (pt.ny * pwr));
                                jokerCtx.stroke();
                            }
                        });
                        jokerCtx.restore();
                    }

                    // --- அசல் 3-PART ACCORDION SEAM (உன் ஒரிஜினல் ரப்பர் லாஜிக் அப்படியே) ---
                    const natW = fgImg.naturalWidth; const natH = fgImg.naturalHeight; const scale = 340 / natH; 
                    const sTop = natH * 0.585; const sBot = natH * 0.625; const sRubberH = sBot - sTop; 

                    const dTopH = sTop * scale;
                    const dRubberH = (sRubberH * scale) + currJaw; 
                    const dBotY = dTopH + dRubberH;
                    const dBotH = (natH - sBot) * scale;

                    const stretchX = -(currSmile * 0.5); const stretchW = 300 + currSmile;

                    // 1. மேல் மண்டை
                    jokerCtx.drawImage(fgImg, 0, 0, natW, sTop,  0, 0, 300, dTopH);
                    // 2. நடுவாய் ரப்பர் (வெட்டப்படாமல் கீழ்நோக்கி இழுபடும் அசல் பகுதி)
                    jokerCtx.drawImage(fgImg, 0, sTop, natW, sRubberH,  stretchX, dTopH, stretchW, dRubberH);
                    // 3. கீழ் தாடை
                    jokerCtx.drawImage(fgImg, 0, sBot, natW, natH - sBot,  stretchX * 0.5, dBotY, 300 + (currSmile*0.5), dBotH);
                }

                // [TOPMOST] - நிரந்தரக் கண் சிமிட்டல்
                jokerCtx.globalAlpha = 1.0; 
                if (isBlinking) {
                    jokerCtx.fillStyle = "#cbd0d3"; 
                    jokerCtx.beginPath(); jokerCtx.ellipse(124.5, 139.4, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                    jokerCtx.beginPath(); jokerCtx.ellipse(175.5, 139.4, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                }
            }
        };

        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
