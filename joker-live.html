<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil Master Visualizer Pro - Auto Silhouette Rig</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; 
        }
        
        .anim-section { 
            width: 100%; height: 100%; 
            position: relative; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box;
        }
        
        #justice-glow {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 110px; height: 110px; border-radius: 50%; 
            background: radial-gradient(circle, rgba(255, 20, 20, 0.85) 0%, rgba(255, 20, 20, 0) 60%), radial-gradient(circle, rgba(255, 215, 0, 0.5) 10%, rgba(255, 215, 0, 0) 80%);
            filter: blur(6px); box-shadow: 0 0 50px rgba(255, 10, 10, 0.95); z-index: 1; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; 
        }

        /* --- THE MASTER LIVE2D STAGE --- */
        #joker-stage {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 350px; z-index: 5; pointer-events: none;
            opacity: 0; transition: opacity 0.4s ease-in-out;
            will-change: transform;
        }

        #vdo-engine { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>

    <div class="anim-section">
        <div id="justice-glow"></div> 
        <canvas id="joker-stage" width="300" height="350"></canvas>
    </div>
    
    <iframe id="vdo-engine" allow="autoplay; microphone"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';
        document.getElementById('vdo-engine').src = `./index.html?scene&room=${roomName}&autostart`;

        let analyser, dataArray; 
        let audioCtx; let lastActiveTime = Date.now(); 
        
        const glowDiv = document.getElementById('justice-glow');
        const jokerCanvas = document.getElementById('joker-stage');
        const jokerCtx = jokerCanvas.getContext('2d');

        // --- PURE SINGLE PNG ASSET ---
        const jokerImg = new Image();
        jokerImg.src = './joker.png'; // உன் அசல் Esports படம்

        // அனிமேஷன் மாறிகள்
        let currJaw = 0, targetJaw = 0;
        let isBlinking = false;
        let silhouettePoints = []; // <--- அவுட்லைன் புள்ளிகளைச் சேமிக்கும் அரே!

        function startBlink() {
            isBlinking = true;
            setTimeout(() => { isBlinking = false; }, 120);
            setTimeout(startBlink, Math.random() * 3500 + 2000);
        }

        // =========================================================================
        // --- 1. THE RADAR SCANNER (படத்தின் அசல் அவுட்லைனை மெமரியில் ஸ்கேன் செய்யும் எந்திரம்)
        // =========================================================================
        function scanImageSilhouette() {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 300; offCanvas.height = 350;
            const offCtx = offCanvas.getContext('2d');
            offCtx.drawImage(jokerImg, 0, 0, 300, 350);
            const imgData = offCtx.getImageData(0, 0, 300, 350).data;

            const cx = 150, cy = 175; // படத்தின் மையம்
            const rays = 85;          // அவுட்லைனைச் சுற்றி அமையும் கம்பிகளின் எண்ணிக்கை

            silhouettePoints = [];

            for (let i = 0; i < rays; i++) {
                // -PI முதல் +PI வரை வட்டமாக லேசர் கதிர்களை வீசுதல்
                const angle = (i / rays) * (Math.PI * 2) - Math.PI;

                // கீழ்ப்பகுதி மார்புப் பகுதிக்குள் கம்பிகள் செல்வதைத் தடுக்க குறிப்பிட்ட கோணத்தை (Downwards) தவிர்த்தல்
                if (angle > 0.8 && angle < 2.3) continue; 

                const nx = Math.cos(angle);
                const ny = Math.sin(angle);
                let hitX = cx, hitY = cy;
                let found = false;

                // 200px வெளிவட்டத்திலிருந்து மையத்தை நோக்கி 'Reverse Raycast' செய்தல்
                for (let r = 200; r > 10; r -= 2) {
                    const px = Math.round(cx + nx * r);
                    const py = Math.round(cy + ny * r);

                    if (px >= 0 && px < 300 && py >= 0 && py < 350) {
                        const alpha = imgData[(py * 300 + px) * 4 + 3];
                        if (alpha > 40) { // அசல் படத்தின் எல்லையைத் தொட்டுவிட்டது!
                            hitX = px; hitY = py;
                            found = true;
                            break;
                        }
                    }
                }

                if (found && hitY < 325) { // கத்தரிக்கப்பட்ட கீழ் பார்டரைத் தவிர்த்து சேமித்தல்
                    silhouettePoints.push({ x: hitX, y: hitY, nx: nx, ny: ny });
                }
            }
        }

        jokerImg.onload = () => { 
            scanImageSilhouette(); // படம் வந்ததும் ஸ்கேன் செய்!
            startBlink(); 
        };

        const connectedTracks = new Set(); 

        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.3; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const iframe = document.getElementById('vdo-engine');
            setInterval(() => {
                try {
                    const iframeWin = iframe.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            pc.addEventListener('track', (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    connectedTracks.add(track.id);
                                    try {
                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        const cleanStream = new MediaStream([track]);
                                        source = audioCtx.createMediaStreamSource(cleanStream);
                                        source.connect(analyser); 
                                    } catch(err) {}
                                }
                            });
                            return pc;
                        };
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 10);

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderVisualizer();
        }

        const renderVisualizer = () => {
            if (!analyser) return; 
            requestAnimationFrame(renderVisualizer);
            analyser.getByteFrequencyData(dataArray);
            
            let totalVolume = 0;
            for(let i=0; i<25; i++) { totalVolume += Math.max(0, (dataArray[i] || 0) - 82); }
            const avgVol = totalVolume / 25;

            if (avgVol > 8) { 
                lastActiveTime = Date.now(); 
                jokerCanvas.style.opacity = "1";
                if (glowDiv) glowDiv.style.opacity = Math.min(1, avgVol / 60);
                targetJaw = Math.min(24, Math.max(0, (avgVol - 8) * 0.65));
            } else {
                targetJaw = 0;
                if (Date.now() - lastActiveTime > 2000) {
                    jokerCanvas.style.opacity = "0";
                    if (glowDiv) glowDiv.style.opacity = "0";
                }
            }

            if (jokerImg.complete && jokerImg.naturalHeight > 0) {
                currJaw += (targetJaw - currJaw) * 0.35; 
                jokerCtx.clearRect(0, 0, 300, 350);

                // =====================================================================
                // --- 2. THE CONTOUR STROKE VISUALIZER (படத்தின் ஓரங்களில் சிலிர்க்கும் கம்பிகள்!)
                // =====================================================================
                if (silhouettePoints.length > 0 && avgVol > 1) {
                    jokerCtx.save();
                    jokerCtx.lineWidth = 3.2;
                    jokerCtx.lineCap = 'round';
                    jokerCtx.shadowColor = '#ff1a1a';
                    jokerCtx.shadowBlur = 10;

                    silhouettePoints.forEach((pt, idx) => {
                        const dataIdx = Math.floor((idx / silhouettePoints.length) * 22);
                        const rawVal = dataArray[dataIdx] || 0;
                        const pwr = Math.max(0, rawVal - 85) * 0.22; // ஆடியோ அதிர்வு

                        if (pwr > 0.5) {
                            jokerCtx.strokeStyle = (idx % 2 === 0) ? '#ff3333' : '#ff9933'; // Cyberpunk Dual Tone
                            jokerCtx.beginPath();
                            // விளிம்பிலிருந்து 2px உள்ளே தொடங்கி வெளியே சுடுதல் (அப்போதுதான் உடலிலிருந்து முளைத்தது போல் இருக்கும்!)
                            jokerCtx.moveTo(pt.x - (pt.nx * 2), pt.y - (pt.ny * 2)); 
                            jokerCtx.lineTo(pt.x + (pt.nx * pwr), pt.y + (pt.ny * pwr));
                            jokerCtx.stroke();
                        }
                    });
                    jokerCtx.restore();
                }

                // --- 3-TIER ANATOMICAL BODY RIG ---
                const natW = jokerImg.naturalWidth; const natH = jokerImg.naturalHeight;
                const scale = 340 / natH; 
                const sTeethLine = natH * 0.585; const sChinTip = natH * 0.685; 

                const hHead = sTeethLine * scale; const hJaw = (sChinTip - sTeethLine) * scale;
                const hTorso = (natH - sChinTip) * scale; const yTorsoFixed = sChinTip * scale;

                // அ. அசைவில்லாத உடல்
                jokerCtx.drawImage(jokerImg, 0, sChinTip, natW, natH - sChinTip, 0, yTorsoFixed, 300, hTorso);

                // ஆ. தொண்டைக்குள் Equalizer
                if (currJaw > 1) {
                    const mLeft = 300 * 0.32, mW = 300 * 0.36;
                    jokerCtx.fillStyle = "#0a0102"; jokerCtx.fillRect(mLeft - 5, hHead, mW + 10, currJaw);

                    const stepX = mW / 20;
                    for (let b = 0; b < 20; b++) {
                        const bin = Math.floor(b * (dataArray.length / 40));
                        const barH = Math.min(currJaw * 0.85, currJaw * ((dataArray[bin] || 0) / 255));
                        jokerCtx.fillStyle = (b % 2 === 0) ? "#ff1a1a" : "#ff9900";
                        jokerCtx.fillRect(mLeft + (b * stepX), hHead + ((currJaw - barH)/2), stepX - 1, barH);
                    }
                }

                // இ. அசையும் தாடை (காலர் துணிக்கு முன்னே இறங்கும்)
                jokerCtx.drawImage(jokerImg, 0, sTeethLine, natW, sChinTip - sTeethLine, 0, hHead + currJaw, 300, hJaw);

                // ஈ. மேல் மண்டை
                jokerCtx.drawImage(jokerImg, 0, 0, natW, sTeethLine, 0, 0, 300, hHead);

                // உ. கண் சிமிட்டல்
                if (isBlinking) {
                    jokerCtx.fillStyle = "#cbd0d3"; 
                    jokerCtx.beginPath(); jokerCtx.ellipse(300 * 0.415, 340 * 0.41, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                    jokerCtx.beginPath(); jokerCtx.ellipse(300 * 0.585, 340 * 0.41, 14, 8, 0, 0, Math.PI*2); jokerCtx.fill();
                }
            }
        };

        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
