<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil Master Visualizer Pro - True 2-Image Rig</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; 
        }
        
        .anim-section { 
            width: 100%; height: 100%; 
            position: relative; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box;
        }
        
        #justice-glow {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border-radius: 50%; 
            background: radial-gradient(circle, rgba(255, 215, 0, 0.95) 0%, rgba(255, 215, 0, 0) 50%), radial-gradient(circle, rgba(255, 215, 0, 0.7) 10%, rgba(255, 215, 0, 0) 80%);
            filter: blur(4px); box-shadow: 0 0 40px rgba(255, 215, 0, 0.9); z-index: 3; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; 
        }

        /* படம் எப்போதும் ஸ்கிரீனில் தெரிவது opacity: 1 !important மூலம் உறுதி செய்யப்பட்டுள்ளது */
        #joker-stage {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 420px; z-index: 4; pointer-events: none;
            opacity: 1 !important; 
            will-change: transform;
        }

        #vdo-engine { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>

    <div class="anim-section">
        <div id="justice-glow"></div> 
        <canvas id="joker-stage" width="300" height="420"></canvas>
    </div>
    
    <iframe id="vdo-engine" allow="autoplay; microphone"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';
        document.getElementById('vdo-engine').src = `./index.html?scene&room=${roomName}&autostart`;

        let analyser, dataArray; 
        let audioCtx; let lastActiveTime = Date.now(); 
        
        const glowDiv = document.getElementById('justice-glow');
        const canvas = document.getElementById('joker-stage');
        const ctx = canvas.getContext('2d');

        // =========================================================================
        // --- 1. THE STRICT REAL ASSETS (நீ சர்வரில் அப்லோட் செய்த 2 படங்கள்) ---
        // =========================================================================
        const imgBg = new Image();  imgBg.src = './joker.jpg';    // அசல் முழுப் படம்
        const imgCut = new Image(); imgCut.src = './joker1.png';  // உடல் நீக்கப்பட்ட தலை (Transparent)

        let outlineNormals = [];
        let currJaw = 0, targetJaw = 0;
        let isBlinking = false;

        function startBlinkLoop() {
            isBlinking = true;
            setTimeout(() => { isBlinking = false; }, 120);
            setTimeout(startBlinkLoop, Math.random() * 3500 + 2000);
        }

        // --- CONTOUR SCANNER (joker1.png-ன் அசல் அவுட்லைனை மெமரியில் ஸ்கேன் செய்யும் எந்திரம்) ---
        function scanCutoutSilhouette() {
            const temp = document.createElement('canvas');
            temp.width = 300; temp.height = 300; // 300x300 சதுரத்திற்குள் தலை அமையும்
            const tctx = temp.getContext('2d', { willReadFrequently: true });
            tctx.drawImage(imgCut, 0, 0, 300, 300);
            const data = tctx.getImageData(0, 0, 300, 300).data;

            const cx = 150, cy = 150; 
            const rays = 75; outlineNormals = [];

            for (let i = 0; i < rays; i++) {
                const angle = (i / rays) * (Math.PI * 2);
                // கழுத்து வெட்டுப்பட்ட கீழ்ப்பகுதியைத் தவிர்க்க
                if (angle > Math.PI * 0.35 && angle < Math.PI * 0.65) continue;

                const nx = Math.cos(angle), ny = Math.sin(angle);
                for (let r = 145; r > 20; r--) {
                    const px = Math.round(cx + nx * r), py = Math.round(cy + ny * r);
                    if (px >= 0 && px < 300 && py >= 0 && py < 300) {
                        if (data[(py * 300 + px) * 4 + 3] > 40) { // Transparent எல்லையைத் தொட்டுவிட்டது!
                            outlineNormals.push({ x: px, y: py, nx: nx, ny: ny });
                            break;
                        }
                    }
                }
            }
        }

        let loadedCount = 0;
        const onAssetLoad = () => {
            loadedCount++;
            if (loadedCount === 2) {
                scanCutoutSilhouette();
                startBlinkLoop();
            }
        };
        imgBg.onload = onAssetLoad; imgCut.onload = onAssetLoad;

        const connectedTracks = new Set(); 

        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.3; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const iframe = document.getElementById('vdo-engine');
            setInterval(() => {
                try {
                    const iframeWin = iframe.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            pc.addEventListener('track', (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    connectedTracks.add(track.id);
                                    try {
                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        const cleanStream = new MediaStream([track]);
                                        source = audioCtx.createMediaStreamSource(cleanStream);
                                        source.connect(analyser); 
                                    } catch(err) {}
                                }
                            });
                            return pc;
                        };
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 10);

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderStage();
        }

        const renderStage = () => {
            if (!analyser) return; 
            requestAnimationFrame(renderStage);
            analyser.getByteFrequencyData(dataArray);
            
            let totalVol = 0;
            for(let i=0; i<25; i++) { totalVol += Math.max(0, (dataArray[i] || 0) - 80); }
            const avgVol = totalVol / 25;

            if (avgVol > 4) { 
                lastActiveTime = Date.now();
                if (glowDiv) glowDiv.style.opacity = Math.min(1, avgVol / 60);

                // சத்தத்தை 0 முதல் 25px தாடை இறக்கமாக மாற்றுதல்
                targetJaw = Math.min(25, Math.max(0, (avgVol - 4) * 0.65));
            } else {
                targetJaw = 0;
                if (Date.now() - lastActiveTime > 2000) {
                    if (glowDiv) glowDiv.style.opacity = "0";
                }
            }

            // =========================================================================
            // --- THE 4-LAYER SANDWICH BUILD (படம் வந்ததும் 24 மணி நேரமும் கேன்வாஸ் நிற்கும்)
            // =========================================================================
            if (loadedCount === 2) {
                
                currJaw += (targetJaw - currJaw) * 0.38; 

                ctx.clearRect(0, 0, 300, 420);

                // ---------------------------------------------------------------------
                // அடுக்கு 0: அசல் முழுப் படம் (joker.jpg) - 300x300 அளவில் அடியில் அசையாமல் நிற்கும்
                // ---------------------------------------------------------------------
                ctx.drawImage(imgBg, 0, 0, 300, 300);

                // ---------------------------------------------------------------------
                // அடுக்கு 1: SILHOUETTE STROKES (joker1.png-ன் அவுட்லைனில் இருந்து சுடும் கம்பிகள்)
                // ---------------------------------------------------------------------
                if (outlineNormals.length > 0 && avgVol > 1) {
                    ctx.save();
                    ctx.lineWidth = 3.0; ctx.lineCap = 'round';
                    ctx.shadowColor = '#ff1a1a'; ctx.shadowBlur = 8;

                    const step = Math.floor((dataArray.length * 0.5) / outlineNormals.length);
                    outlineNormals.forEach((norm, idx) => {
                        const audioVal = Math.max(0, (dataArray[idx * step] || 0) - 85) * 0.22;
                        if (audioVal > 1) {
                            ctx.strokeStyle = (idx % 2 === 0) ? '#ff3333' : '#ff9933';
                            ctx.beginPath();
                            ctx.moveTo(norm.x, norm.y);
                            ctx.lineTo(norm.x + (norm.nx * audioVal), norm.y + (normal.ny * audioVal));
                            ctx.stroke();
                        }
                    });
                    ctx.restore();
                }

                // --- வாயின் பிளவை மறைக்கும் கருப்புத் தொண்டை ---
                if (currJaw > 1) {
                    ctx.fillStyle = "#050000"; 
                    ctx.fillRect(100, 175, 100, currJaw + 2);

                    // வாய்க்குள் ஆடும் மைக்ரோ ஈக்வலைசர்!
                    const barW = 100 / 15;
                    for(let b=0; b<15; b++) {
                        const val = (dataArray[b*2] || 0) / 255;
                        const bh = Math.min(currJaw * 0.8, currJaw * val);
                        ctx.fillStyle = (b%2===0) ? "#ff1a1a" : "#ff8800";
                        ctx.fillRect(100 + (b*barW), 176 + (currJaw - bh)/2, barW - 1, bh);
                    }
                }

                // --- 2.5D GUILLOTINE SLICE MATH ---
                const natW = imgCut.naturalWidth, natH = imgCut.naturalHeight;
                const splitY_nat = natH * 0.585; // பற்களுக்கு நடுவில் செல்லும் கோடு
                const splitY_draw = 300 * 0.585; // 175.5 px

                // ---------------------------------------------------------------------
                // அடுக்கு 2: அசையும் தாடை (joker1.png கீழ்ப்பாதி -> currJaw px கீழே இறங்கும்)
                // ---------------------------------------------------------------------
                ctx.drawImage(
                    imgCut, 
                    0, splitY_nat, natW, natH - splitY_nat, 
                    0, splitY_draw + currJaw, 300, 300 - splitY_draw
                );

                // ---------------------------------------------------------------------
                // அடுக்கு 3: அசையாத மேல் மண்டை (joker1.png மேல்பாதி -> Y=0-ல் லாக்)
                // ---------------------------------------------------------------------
                ctx.drawImage(
                    imgCut, 
                    0, 0, natW, splitY_nat, 
                    0, 0, 300, splitY_draw
                );

                // ---------------------------------------------------------------------
                // அடுக்கு 4: கண் சிமிட்டல்
                // ---------------------------------------------------------------------
                if (isBlinking) {
                    ctx.fillStyle = "#cbd0d3"; 
                    ctx.beginPath(); ctx.ellipse(300 * 0.415, 300 * 0.41, 13, 7.5, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(300 * 0.585, 300 * 0.41, 13, 7.5, 0, 0, Math.PI*2); ctx.fill();
                }
            }
        };

        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
