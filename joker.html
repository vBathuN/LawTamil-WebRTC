<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil VTuber Pro - True Sandwich Rig</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; 
        }
        
        .anim-section { 
            width: 100%; height: 100%; 
            position: relative; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box;
        }
        
        #justice-glow {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border-radius: 50%; 
            background: radial-gradient(circle, rgba(255, 30, 30, 0.85) 0%, rgba(255, 30, 30, 0) 60%), radial-gradient(circle, rgba(255, 215, 0, 0.5) 10%, rgba(255, 215, 0, 0) 80%);
            filter: blur(5px); box-shadow: 0 0 45px rgba(255, 20, 20, 0.95); z-index: 1; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; 
        }

        /* கேன்வாஸ் எப்போதும் ஸ்கிரீனில் தெரிவது 100% உறுதி செய்யப்பட்டுள்ளது */
        #joker-stage {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
            width: 350px; height: 350px; z-index: 5; pointer-events: none;
            opacity: 1 !important; 
            will-change: transform;
        }

        #vdo-engine { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>

    <div class="anim-section">
        <div id="justice-glow"></div> 
        <canvas id="joker-stage" width="350" height="350"></canvas>
    </div>
    
    <iframe id="vdo-engine" allow="autoplay; microphone"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';
        document.getElementById('vdo-engine').src = `./index.html?scene&room=${roomName}&autostart`;

        let analyser, dataArray; 
        let audioCtx; let lastActiveTime = Date.now(); 
        
        const glowDiv = document.getElementById('justice-glow');
        const canvas = document.getElementById('joker-stage');
        const ctx = canvas.getContext('2d');

        // =========================================================================
        // --- THE TWO MASTER ASSETS (உன் சர்வர் ஃபோல்டரில் உள்ள அசல் 2 படங்கள்) ---
        // =========================================================================
        const imgBg = new Image();   imgBg.src = './joker.jpg';    // அசல் முழுப் படம் (பின்னணியோடு)
        const imgHead = new Image(); imgHead.src = './joker1.png'; // உடல் நீக்கப்பட்ட தலை (Transparent)

        let currJaw = 0, targetJaw = 0;
        let isBlinking = false;

        function startBlinkLoop() {
            isBlinking = true;
            setTimeout(() => { isBlinking = false; }, 120);
            setTimeout(startBlinkLoop, Math.random() * 3500 + 2000);
        }
        imgHead.onload = () => { startBlinkLoop(); };

        const connectedTracks = new Set(); 

        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.3; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const iframe = document.getElementById('vdo-engine');
            setInterval(() => {
                try {
                    const iframeWin = iframe.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            pc.addEventListener('track', (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    connectedTracks.add(track.id);
                                    try {
                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        const cleanStream = new MediaStream([track]);
                                        source = audioCtx.createMediaStreamSource(cleanStream);
                                        source.connect(analyser); 
                                    } catch(err) {}
                                }
                            });
                            return pc;
                        };
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 10);

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderStage();
        }

        const renderStage = () => {
            if (!analyser) return; 
            requestAnimationFrame(renderStage);
            analyser.getByteFrequencyData(dataArray);
            
            let totalVol = 0;
            for(let i=0; i<25; i++) { totalVol += Math.max(0, (dataArray[i] || 0) - 80); }
            const avgVol = totalVol / 25;

            // சென்சிட்டிவிட்டி 5 ஆக வைக்கப்பட்டுள்ளது (சின்ன சத்தத்திற்கும் வாய் ஆடும்)
            if (avgVol > 5) { 
                lastActiveTime = Date.now();
                if (glowDiv) glowDiv.style.opacity = Math.min(1, avgVol / 60);

                // சத்தத்தை 0 முதல் 22px தாடை இறக்கமாக மாற்றுதல்
                targetJaw = Math.min(22, Math.max(0, (avgVol - 5) * 0.6));
            } else {
                targetJaw = 0;
                if (Date.now() - lastActiveTime > 2000) {
                    if (glowDiv) glowDiv.style.opacity = "0";
                }
            }

            // =========================================================================
            // --- THE 4-LAYER SANDWICH DRAW (படம் இருந்தாலும் இல்லாவிட்டாலும் கேன்வாஸ் இயங்கும்)
            // =========================================================================
            if (imgBg.complete && imgHead.complete && imgHead.naturalHeight > 0) {
                
                currJaw += (targetJaw - currJaw) * 0.38; // தாடை நடுக்கத் தடுப்பான்

                ctx.clearRect(0, 0, 350, 350);

                // ---------------------------------------------------------------------
                // அடுக்கு 0: அசல் முழுப் படம் (joker.jpg) - நிரந்தரப் பின்னணி
                // ---------------------------------------------------------------------
                ctx.drawImage(imgBg, 0, 0, 350, 350);

                // ---------------------------------------------------------------------
                // அடுக்கு 1: THE CROWN VISUALIZER (ஜோக்கரின் தலைக்குப்பின்னால் சிலிர்க்கும் கம்பிகள்)
                // ---------------------------------------------------------------------
                if (avgVol > 1) {
                    ctx.save();
                    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
                    ctx.strokeStyle = '#ff3333'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 8;

                    const cx = 175, cy = 175;
                    const r = 105; // அவனது தலைமுடி விளிம்பின் தோராயமான ரேடியஸ்
                    const bars = 45;
                    // -160 deg (இடது தோள்) முதல் -20 deg (வலது தோள்) வரை தலைக்கு மேல் வளைவு
                    const startAng = -160 * (Math.PI / 180);
                    const angStep = (140 * (Math.PI / 180)) / (bars - 1);

                    for(let i=0; i<bars; i++) {
                        const ang = startAng + (i * angStep);
                        const bin = Math.floor((i / bars) * 22);
                        const val = Math.max(0, (dataArray[bin] || 0) - 85) * 0.24;

                        if (val > 1) {
                            ctx.beginPath();
                            ctx.moveTo(cx + Math.cos(ang)*r, cy + Math.sin(ang)*r);
                            ctx.lineTo(cx + Math.cos(ang)*(r + val), cy + Math.sin(ang)*(r + val));
                            ctx.stroke();
                        }
                    }
                    ctx.restore();
                }

                // --- 2.5D GUILLOTINE SLICE MATH ---
                const natW = imgHead.naturalWidth, natH = imgHead.naturalHeight;
                const scale = 350 / natH; 
                
                // joker1.png-ல் பற்களுக்கு நடுவில் செல்லும் அசல் Y-கோடு (58.5%)
                const splitY_nat = natH * 0.585; 
                const splitY_draw = splitY_nat * scale;

                // ---------------------------------------------------------------------
                // அடுக்கு 2: அசையும் தாடை (currJaw px அளவுக்குக் கீழே இறங்கும்)
                // ---------------------------------------------------------------------
                ctx.drawImage(
                    imgHead, 
                    0, splitY_nat, natW, natH - splitY_nat, 
                    0, splitY_draw + currJaw, 350, (natH - splitY_nat) * scale
                );

                // ---------------------------------------------------------------------
                // அடுக்கு 3: அசையாத மேல் மண்டை (கம்பிகளைத் தலைமுடிக்குள்ளேயே மறைக்கும்)
                // ---------------------------------------------------------------------
                ctx.drawImage(
                    imgHead, 
                    0, 0, natW, splitY_nat, 
                    0, 0, 350, splitY_draw
                );

                // ---------------------------------------------------------------------
                // அடுக்கு 4: கண் சிமிட்டல்
                // ---------------------------------------------------------------------
                if (isBlinking) {
                    ctx.fillStyle = "#cbd0d3"; 
                    ctx.beginPath(); ctx.ellipse(350 * 0.415, 350 * 0.41, 13, 7.5, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(350 * 0.585, 350 * 0.41, 13, 7.5, 0, 0, Math.PI*2); ctx.fill();
                }
            }
        };

        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
