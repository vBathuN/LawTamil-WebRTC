<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil Master Visualizer Pro - CrashProof 2.5D Rig</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; 
        }
        
        .anim-section { 
            width: 100%; height: 100%; 
            position: relative; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box;
        }
        
        #justice-glow {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; border-radius: 50%; 
            background: radial-gradient(circle, rgba(255, 20, 20, 0.85) 0%, rgba(255, 20, 20, 0) 60%), radial-gradient(circle, rgba(255, 215, 0, 0.5) 10%, rgba(255, 215, 0, 0) 80%);
            filter: blur(6px); box-shadow: 0 0 50px rgba(255, 10, 10, 0.95); z-index: 1; opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; 
        }

        /* --- THE MASTER LIVE2D STAGE --- */
        /* opacity: 1 !important மூலம் கேரக்டர் எப்போதும் ஸ்கிரீனில் தெரிவது உறுதி செய்யப்பட்டுள்ளது */
        #joker-stage {
            position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 350px; z-index: 5; pointer-events: none;
            opacity: 1 !important; 
            will-change: transform;
        }

        #vdo-engine { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>

    <div class="anim-section">
        <div id="justice-glow"></div> 
        <canvas id="joker-stage" width="300" height="350"></canvas>
    </div>
    
    <iframe id="vdo-engine" allow="autoplay; microphone"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';
        document.getElementById('vdo-engine').src = `./index.html?scene&room=${roomName}&autostart`;

        let analyser, dataArray; 
        let audioCtx; 
        
        const glowDiv = document.getElementById('justice-glow');
        const canvas = document.getElementById('joker-stage');
        const ctx = canvas.getContext('2d');

        // --- 1. THE TWO MASTER ASSETS ---
        const imgBg = new Image();   imgBg.src = './joker.jpg';     // அசல் முழுப் படம்
        const imgHead = new Image(); imgHead.src = './joker1.png';  // தலை + தாடை மட்டும் (Transparent)

        let outlinePoints = [];
        let currJaw = 0, targetJaw = 0;
        let isBlinking = false;

        function startBlink() {
            isBlinking = true;
            setTimeout(() => { isBlinking = false; }, 120);
            setTimeout(startBlink, Math.random() * 3500 + 2000);
        }

        // --- CRASH-PROOF SILHOUETTE SCANNER ---
        function scanHeadSilhouette() {
            outlinePoints = [];
            const cx = 150, cy = 160; 
            const rays = 80;

            try {
                // முயற்சி A: அசல் பிக்சல் ஸ்கேன் (Web Server வழியாகத் திறந்திருந்தால் வேலை செய்யும்)
                const off = document.createElement('canvas');
                off.width = 300; off.height = 350;
                const octx = off.getContext('2d', { willReadFrequently: true });
                octx.drawImage(imgHead, 0, 0, 300, 350);
                const imgData = octx.getImageData(0, 0, 300, 350).data;

                for (let i = 0; i < rays; i++) {
                    const angle = (i / rays) * (Math.PI * 2);
                    if (angle > Math.PI * 0.35 && angle < Math.PI * 0.65) continue;

                    const nx = Math.cos(angle), ny = Math.sin(angle);
                    for (let r = 160; r > 20; r--) {
                        const px = Math.round(cx + nx * r), py = Math.round(cy + ny * r);
                        if (px >= 0 && px < 300 && py >= 0 && py < 350) {
                            if (imgData[(py * 300 + px) * 4 + 3] > 40) { 
                                outlinePoints.push({ x: px, y: py, nx: nx, ny: ny });
                                break;
                            }
                        }
                    }
                }
            } catch(e) {
                // --- THE MASTER FALLBACK (CORS எரர் அடித்து JS கிராஷ் ஆவதைத் தடுக்கும் வலை) ---
                // Local File ஆகத் திறந்திருப்பதால் Browser பிக்சல் ஸ்கேனைக் கொன்றுவிட்டது.
                // எனவே நாமே ஜோக்கரின் தலை அளவுக்கு ஒரு 'ஸ்டாண்டர்ட் நீள்வட்ட அவுட்லைனை' மெமரியில் லாக் செய்கிறோம்!
                for (let i = 0; i < rays; i++) {
                    const angle = (i / rays) * (Math.PI * 2);
                    if (angle > Math.PI * 0.35 && angle < Math.PI * 0.65) continue;

                    const nx = Math.cos(angle), ny = Math.sin(angle);
                    const rX = 115, rY = 135; // கேரக்டரின் தோராயமான தலை ரேடியஸ்
                    outlinePoints.push({ 
                        x: Math.round(cx + nx * rX), 
                        y: Math.round(cy + ny * rY * 0.95), 
                        nx: nx, ny: ny 
                    });
                }
            }
        }

        imgHead.onload = () => { 
            scanHeadSilhouette(); 
            startBlink(); 
        };

        const connectedTracks = new Set(); 

        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.3; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const iframe = document.getElementById('vdo-engine');
            setInterval(() => {
                try {
                    const iframeWin = iframe.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            pc.addEventListener('track', (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    connectedTracks.add(track.id);
                                    try {
                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        const cleanStream = new MediaStream([track]);
                                        source = audioCtx.createMediaStreamSource(cleanStream);
                                        source.connect(analyser); 
                                    } catch(err) {}
                                }
                            });
                            return pc;
                        };
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 10);

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderVisualizer();
        }

        const renderVisualizer = () => {
            if (!analyser) return; 
            requestAnimationFrame(renderVisualizer);
            analyser.getByteFrequencyData(dataArray);
            
            let totalVol = 0;
            for(let i=0; i<25; i++) { totalVol += Math.max(0, (dataArray[i] || 0) - 82); }
            const avgVol = totalVol / 25;

            // பேசும் சத்தத்திற்கான சென்சிட்டிவிட்டி (Threshold) 8-ல் இருந்து 5 ஆகக் குறைக்கப்பட்டுள்ளது
            if (avgVol > 5) { 
                if (glowDiv) glowDiv.style.opacity = Math.min(1, avgVol / 60);
                targetJaw = Math.min(25, Math.max(0, (avgVol - 5) * 0.7));
            } else {
                targetJaw = 0;
                if (glowDiv) glowDiv.style.opacity = "0";
            }

            // =========================================================================
            // --- UNCONDITIONAL MASTER DRAW (சத்தம் இருந்தாலும் இல்லாவிட்டாலும் படம் வரையப்படும்!) ---
            // =========================================================================
            if (imgBg.complete && imgHead.complete && imgHead.naturalHeight > 0) {
                
                currJaw += (targetJaw - currJaw) * 0.38; 

                ctx.clearRect(0, 0, 300, 350);

                // அடுக்கு 0: அசல் முழுப் படம் (joker.jpg) - நிரந்தரப் பின்னணி
                ctx.drawImage(imgBg, 0, 0, 300, 350);

                // அடுக்கு 1: CONTOUR STROKES
                if (outlinePoints.length > 0 && avgVol > 1) {
                    ctx.save();
                    ctx.lineWidth = 3.2; ctx.lineCap = 'round';
                    ctx.shadowColor = '#ff1a1a'; ctx.shadowBlur = 8;

                    const step = Math.floor((dataArray.length * 0.55) / outlinePoints.length);
                    outlinePoints.forEach((pt, i) => {
                        const pwr = Math.max(0, (dataArray[i * step] || 0) - 85) * 0.22;
                        if (pwr > 1) {
                            ctx.strokeStyle = (i % 2 === 0) ? '#ff3333' : '#ff9933';
                            ctx.beginPath();
                            ctx.moveTo(pt.x - (pt.nx * 2), pt.y - (pt.ny * 2));
                            ctx.lineTo(pt.x + (pt.nx * pwr), pt.y + (pt.ny * pwr));
                            ctx.stroke();
                        }
                    });
                    ctx.restore();
                }

                const natW = imgHead.naturalWidth, natH = imgHead.naturalHeight;
                const scale = 350 / natH; 
                const splitY = natH * 0.585; const splitH = splitY * scale;

                // அடுக்கு 2: அசையும் தாடை (currJaw px கீழே இறங்கும்)
                ctx.drawImage(imgHead, 0, splitY, natW, natH - splitY, 0, splitH + currJaw, 300, (natH - splitY) * scale);

                // அடுக்கு 3: அசையாத மேல் மண்டை
                ctx.drawImage(imgHead, 0, 0, natW, splitY, 0, 0, 300, splitH);

                // ஈ. கண் சிமிட்டல்
                if (isBlinking) {
                    ctx.fillStyle = "#cbd0d3"; 
                    ctx.beginPath(); ctx.ellipse(300 * 0.415, 350 * 0.41, 13, 7.5, 0, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(300 * 0.585, 350 * 0.41, 13, 7.5, 0, 0, Math.PI*2); ctx.fill();
                }
            }
        };

        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
