<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil Podcast - Pro Broadcast Overlay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        /* --- RESET & ZERO MARGIN POLICY --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        @font-face {
          font-family: 'Tamil039';
          src: url('https://cdn.lawtamil.in/font/Tamil039.woff2') format('woff2'),
               url('https://cdn.lawtamil.in/font/Tamil039.woff') format('woff');
          font-weight: bold; font-style: normal; font-display: swap; 
        }

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

        body { 
            background-image: url("https://ul.lawtamil.in/bg.jpg?v=1.1") !important; 
            background-color: #000510; 
            background-size: cover; background-position: center;
            overflow: hidden; 
            height: 100vh; width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
        }

        /* =========================================================
           1. LEFT SIDE: TICKER WIDGET
           ========================================================= */
        .left-ad-slot {
            width: 25vw; height: 100vh;
            background-color: transparent !important;
            border-right: 2px solid rgba(255, 202, 112, 0.3);
            z-index: 30; position: relative;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
        }

        .breaking-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; background: rgba(0, 20, 50, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            text-align: center; height: 100%; overflow: hidden;
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        #adbreakingnews { width: 100%; padding: 15px 10px 0 10px; height: 100%; overflow-y: auto; }

        /* =========================================================
           2. TOP HEADER: LAW PODCAST BRANDING
           ========================================================= */
        .channel-title-corner {
            position: absolute; top: 3vh; right: 3vw; display: flex; flex-direction: column; align-items: flex-end;
            z-index: 40; transition: top 0.5s ease;
        }
        
        .title-group {
            display: flex; border-radius: 12px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(255, 202, 112, 0.2);
            border: 1px solid rgba(255, 202, 112, 0.5);
            background: rgba(0, 25, 60, 0.8); backdrop-filter: blur(15px);
        }

        /* 🟢 Custom Font Padding Fixes */
        .logo-main { 
            font-family: 'Tamil039', sans-serif; font-size: 2.2vw; 
            background: linear-gradient(135deg, #00193c, #003380); 
            color: #ffca70; text-shadow: 0px 4px 10px rgba(0,0,0,0.9); 
            line-height: 1; word-spacing: -10px;
            padding-top: 2.5vh; padding-bottom: 0.8vh; padding-left: 0.8vw; padding-right: 0.8vw;
        }
        .logo-sub { 
            font-family: 'Tamil039', sans-serif; font-size: 1.4vw; 
            background: #d93025; color: white; 
            display: flex; align-items: center; justify-content: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6); line-height: 1; word-spacing: -5px;
            padding-top: 2.5vh; padding-bottom: 0.8vh; padding-left: 0.8vw; padding-right: 0.8vw;
        }
        .podcast-badge {
            margin-top: 1.5vh; font-family: 'Montserrat', sans-serif; font-weight: 900;
            background: #ffca70; color: #00193c; padding: 0.6vh 1.5vw;
            border-radius: 6px; font-size: 1vw; letter-spacing: 2.5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6); display: inline-block;
        }

        /* =========================================================
           3. RIGHT SIDE: 3-PERSON PODCAST STAGE
           ========================================================= */
        .right-jokers-stage {
            width: 75vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 12vh 2vw 5vh 2vw; 
            gap: 2.5vw; position: relative;
            transition: all 0.6s ease-in-out;
            flex-wrap: wrap;
        }

        .vtuber-pod {
            position: relative;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
            margin-top: 5vh; 
        }

        .vtuber-pod.hidden-pod {
            display: none !important;
            opacity: 0; pointer-events: none;
            transform: scale(0.5);
        }

        body.single-mode .vtuber-pod:not(.hidden-pod) { width: 22vw; height: 50vh; }
        body.dual-mode .vtuber-pod:not(.hidden-pod) { width: 19vw; height: 45vh; }
        body.triple-mode .vtuber-pod:not(.hidden-pod) { width: 17vw; height: 42vh; }

        .glass-pod-frame {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 16px; z-index: 5;
            background: linear-gradient(135deg, rgba(0, 25, 60, 0.65) 0%, rgba(15, 15, 25, 0.85) 100%);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            transition: all 0.3s ease;
        }

        .vtuber-pod.talking .glass-pod-frame {
            border: 2px solid #ffca70;
            box-shadow: 0 0 25px rgba(255, 202, 112, 0.5), inset 0 0 15px rgba(255, 202, 112, 0.2);
        }

        .photo-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 2vh 1vw;
        }

        .lawyer-photo {
            width: 75%; 
            aspect-ratio: 3 / 4; 
            object-fit: cover;
            border-radius: 10px; border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            background-color: #0f172a;
            transition: border 0.3s ease;
        }
        
        .vtuber-pod.talking .lawyer-photo { border: 2px solid rgba(255, 202, 112, 0.6); }

        .audio-visualizer {
            display: flex; gap: 5px; align-items: flex-end; justify-content: center;
            height: 35px; margin-top: 15px; opacity: 0; transition: opacity 0.3s ease;
            width: 70%;
        }
        .vtuber-pod.talking .audio-visualizer { opacity: 1; }
        
        .vis-bar {
            flex: 1; max-width: 6px; background: linear-gradient(to top, #ffac33, #ffca70);
            border-radius: 3px; transition: height 0.05s ease;
            box-shadow: 0 0 8px rgba(255, 202, 112, 0.8);
        }

        /* 🟢 Updated Name Badge Styles for Dual Lines */
        .speaker-badge {
            position: absolute; bottom: -3.5vh; left: 50%; transform: translateX(-50%);
            width: 85%; background: rgba(0, 25, 60, 0.95); border: 2px solid #ffca70;
            padding: 0.6vh 0.8vw; border-radius: 8px; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); z-index: 20;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.5s ease;
        }
        body.single-mode .speaker-badge { bottom: -4vh; padding: 0.8vh 1vw; }
        
        .badge-active-indicator {
            display: flex; flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%;
            background: #555; transition: background 0.3s ease;
        }
        .vtuber-pod.talking .badge-active-indicator { background: #00ff66; box-shadow: 0 0 10px #00ff66; }
        
        .badge-text-group {
            display: flex; flex-direction: column; align-items: flex-start;
            justify-content: center; overflow: hidden; line-height: 1.1;
        }
        
        .badge-name { 
            font-family: 'Tamil039', sans-serif; font-size: 1.6vw; 
            font-weight: bold; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
            letter-spacing: 0.5px; padding-top: 2px;
        }
        .badge-title {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            font-size: 0.75vw; color: #ffca70; font-weight: bold; letter-spacing: 1px;
        }

        /* =========================================================
           4. PORTRAIT (9:16) RESPONSIVE RULES
           ========================================================= */
        @media (orientation: portrait) {
            .left-ad-slot { display: none !important; }
            .right-jokers-stage { width: 100vw !important; padding: 15vh 2vw 5vh 2vw !important; flex-direction: column; gap: 5vh; }
            
            .channel-title-corner { top: 3vh; right: auto; left: 50%; transform: translateX(-50%); align-items: center; }
            .logo-main { font-size: 4.5vw; } .logo-sub { font-size: 3vw; } .podcast-badge { font-size: 2.5vw; }

            body.single-mode .vtuber-pod:not(.hidden-pod) { width: 60vw; height: 45vh; }
            body.dual-mode .vtuber-pod:not(.hidden-pod) { width: 50vw; height: 35vh; }
            body.triple-mode .vtuber-pod:not(.hidden-pod) { width: 45vw; height: 25vh; }

            .speaker-badge { width: 90%; bottom: -3vh !important; }
            .badge-name { font-size: 4vw; }
            .badge-title { font-size: 2vw; }
        }
    </style>
</head>
<body class="single-mode">

    <div class="left-ad-slot">
        <div class="breaking-container">
            <div id='adbreakingnews'></div>
        </div>
    </div>

    <div class="channel-title-corner">
        <div class="title-group">
            <div class="logo-main">சட்டக் களம்</div>
            <div class="logo-sub">இது நீதியின் தேடல்</div>
        </div>
        <div class="podcast-badge">LAW PODCAST</div>
    </div>

    <!-- 3 Person Stage -->
    <div class="right-jokers-stage" id="stage-container">
        
        <!-- Speaker 1 -->
        <div class="vtuber-pod" id="pod-1">
            <div class="glass-pod-frame"></div>
            <div class="photo-container">
                <img src="https://assets.lawtamil.in/images/placeholder.png" alt="Advocate" class="lawyer-photo">
                <div class="audio-visualizer" id="vis-1">
                    <div class="vis-bar"></div><div class="vis-bar"></div><div class="vis-bar"></div>
                    <div class="vis-bar"></div><div class="vis-bar"></div><div class="vis-bar"></div>
                    <div class="vis-bar"></div><div class="vis-bar"></div>
                </div>
            </div>
            <div class="speaker-badge">
                <div class="badge-active-indicator"></div>
                <div class="badge-text-group">
                    <div class="badge-name">Advocate 1</div>
                    <div class="badge-title">வழக்கறிஞர்</div>
                </div>
            </div>
        </div>

        <!-- Speaker 2 -->
        <div class="vtuber-pod hidden-pod" id="pod-2">
            <div class="glass-pod-frame"></div>
            <div class="photo-container">
                <img src="https://assets.lawtamil.in/images/placeholder.png" alt="Advocate" class="lawyer-photo">
                <div class="audio-visualizer" id="vis-2">
                    <div class="vis-bar"></div><div class="vis-bar"></div><div class="vis-bar"></div>
                    <div class="vis-bar"></div><div class="vis-bar"></div><div class="vis-bar"></div>
                    <div class="vis-bar"></div><div class="vis-bar"></div>
                </div>
            </div>
            <div class="speaker-badge">
                <div class="badge-active-indicator"></div>
                <div class="badge-text-group">
                    <div class="badge-name">Advocate 2</div>
                    <div class="badge-title">வழக்கறிஞர்</div>
                </div>
            </div>
        </div>

        <!-- Speaker 3 -->
        <div class="vtuber-pod hidden-pod" id="pod-3">
            <div class="glass-pod-frame"></div>
            <div class="photo-container">
                <img src="https://assets.lawtamil.in/images/placeholder.png" alt="Advocate" class="lawyer-photo">
                <div class="audio-visualizer" id="vis-3">
                    <div class="vis-bar"></div><div class="vis-bar"></div><div class="vis-bar"></div>
                    <div class="vis-bar"></div><div class="vis-bar"></div><div class="vis-bar"></div>
                    <div class="vis-bar"></div><div class="vis-bar"></div>
                </div>
            </div>
            <div class="speaker-badge">
                <div class="badge-active-indicator"></div>
                <div class="badge-text-group">
                    <div class="badge-name">Advocate 3</div>
                    <div class="badge-title">வழக்கறிஞர்</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';

        const vdoTransport = document.createElement('iframe');
        vdoTransport.allow = "autoplay; microphone";
        vdoTransport.style.cssText = "position:absolute;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1";
        vdoTransport.src = `./index.html?scene&room=${roomName}&autostart&stereo&proaudio&vol=0&remote`;
        document.body.appendChild(vdoTransport);

        let audioCtx; 

        // 🟢 Name Mapping (English Input -> Tamil Output)
        const knownAdvocates = {
            'eakanthan': 'ஏகாந்தன்',
            'ekanthan': 'ஏகாந்தன்', 
            'balaguru': 'பாலகுரு',
            'nandhivarman': 'நந்திவர்மன்'
        };

        const speakers = [
            {
                id: 'Speaker1', pod: document.getElementById('pod-1'), visContainer: document.getElementById('vis-1'),
                bars: Array.from(document.getElementById('vis-1').querySelectorAll('.vis-bar')),
                advMatch: null, streamId: null, analyser: null, dataArray: null, trackId: null, track: null, pc: null
            },
            {
                id: 'Speaker2', pod: document.getElementById('pod-2'), visContainer: document.getElementById('vis-2'),
                bars: Array.from(document.getElementById('vis-2').querySelectorAll('.vis-bar')),
                advMatch: null, streamId: null, analyser: null, dataArray: null, trackId: null, track: null, pc: null
            },
            {
                id: 'Speaker3', pod: document.getElementById('pod-3'), visContainer: document.getElementById('vis-3'),
                bars: Array.from(document.getElementById('vis-3').querySelectorAll('.vis-bar')),
                advMatch: null, streamId: null, analyser: null, dataArray: null, trackId: null, track: null, pc: null
            }
        ];

        const connectedTracks = new Map();
        const waitingQueue = []; 

        function updateStageLayout() {
            const activeCount = speakers.filter(s => s.trackId !== null).length || 1; 
            
            document.body.classList.remove('single-mode', 'dual-mode', 'triple-mode');
            
            if (activeCount === 1) document.body.classList.add('single-mode');
            else if (activeCount === 2) document.body.classList.add('dual-mode');
            else document.body.classList.add('triple-mode');

            speakers.forEach((spk, index) => {
                if (index === 0 || spk.trackId !== null) {
                    spk.pod.classList.remove('hidden-pod');
                } else {
                    spk.pod.classList.add('hidden-pod');
                }
            });
        }

        // 🟢 Advanced Deep Scan Logic to find Name regardless of Custom CSS URL
        function updateSpeakerIdentity(spk) {
            if (spk.advMatch) return; // Already identified

            let identifiers = [];
            if (spk.track) {
                if (spk.track.id) identifiers.push(spk.track.id);
                if (spk.track.label) identifiers.push(spk.track.label);
            }
            if (spk.streamId) identifiers.push(spk.streamId);
            
            if (spk.pc && spk.pc.remoteDescription && spk.pc.remoteDescription.sdp) {
                identifiers.push(spk.pc.remoteDescription.sdp);
            }
            
            // Scan VDO.Ninja iframe DOM for dynamic labels
            try {
                const win = vdoTransport.contentWindow;
                if (win && win.document) {
                    const mediaEls = win.document.querySelectorAll('video, audio');
                    for (let el of mediaEls) {
                        if (el.srcObject) {
                            const tracks = el.srcObject.getTracks();
                            if (tracks.some(t => t === spk.track || t.id === spk.track.id)) {
                                if (el.id) identifiers.push(el.id);
                                if (el.dataset && el.dataset.label) identifiers.push(el.dataset.label);
                                let container = el.closest('.video-container') || el.parentElement;
                                if (container) {
                                    identifiers.push(container.innerText);
                                }
                            }
                        }
                    }
                }
            } catch(e) {}

            let searchString = identifiers.join(" ").toLowerCase();
            let match = null;
            
            for(let engName in knownAdvocates) {
                if(searchString.includes(engName)) {
                    match = { eng: engName, tam: knownAdvocates[engName] };
                    break;
                }
            }

            if (match) {
                spk.advMatch = match;
                const imgEl = spk.pod.querySelector('.lawyer-photo');
                const nameEl = spk.pod.querySelector('.badge-name');
                const titleEl = spk.pod.querySelector('.badge-title');
                
                // Remove previous onerror hooks
                imgEl.onerror = null;
                
                // 🟢 Fallback Image Load Chain (Local -> Domain -> PNGs -> Placeholder)
                imgEl.src = `./${match.eng}.jpg`;
                imgEl.onerror = function() {
                    this.onerror = function() {
                        this.onerror = function() {
                            this.onerror = function() {
                                this.onerror = null;
                                this.src = 'https://assets.lawtamil.in/images/placeholder.png';
                            };
                            this.src = `https://webrtc.lawtamil.in/${match.eng}.png`;
                        };
                        this.src = `./${match.eng}.png`;
                    };
                    this.src = `https://webrtc.lawtamil.in/${match.eng}.jpg`;
                };
                
                nameEl.textContent = match.tam;
                titleEl.textContent = 'வழக்கறிஞர்';
            }
        }

        function assignTrackToSpeaker(track, pc, eventObj) {
            let availSpeaker = speakers.find(s => s.trackId === null);
            if (!availSpeaker) return false;

            availSpeaker.trackId = track.id;
            availSpeaker.track = track;
            availSpeaker.pc = pc;
            availSpeaker.advMatch = null;
            
            // Accurately capture Stream ID from event
            availSpeaker.streamId = (eventObj && eventObj.streams && eventObj.streams.length > 0) ? eventObj.streams[0].id : (track.id || "");

            // Attempt identification immediately
            updateSpeakerIdentity(availSpeaker);

            if (audioCtx.state === 'suspended') audioCtx.resume();
            availSpeaker.analyser = audioCtx.createAnalyser();
            availSpeaker.analyser.fftSize = 64; 
            availSpeaker.analyser.smoothingTimeConstant = 0.5;
            availSpeaker.dataArray = new Uint8Array(availSpeaker.analyser.frequencyBinCount);

            const cleanStream = new MediaStream([track]);
            const rawMic = audioCtx.createMediaStreamSource(cleanStream);
            rawMic.connect(availSpeaker.analyser); 
            availSpeaker.analyser.connect(audioCtx.destination);

            updateStageLayout();

            track.onended = () => { handleTrackDisconnect(availSpeaker); };
            return true;
        }

        function handleTrackDisconnect(spk) {
            if (spk.trackId) connectedTracks.delete(spk.trackId);
            spk.trackId = null; spk.track = null; spk.pc = null;
            spk.streamId = null; spk.advMatch = null;
            spk.analyser = null; spk.dataArray = null;
            
            const imgEl = spk.pod.querySelector('.lawyer-photo');
            imgEl.src = 'https://assets.lawtamil.in/images/placeholder.png';
            imgEl.onerror = null;
            spk.pod.querySelector('.badge-name').textContent = 'Advocate';
            spk.pod.querySelector('.badge-title').textContent = 'வழக்கறிஞர்';

            if (waitingQueue.length > 0) {
                const nextItem = waitingQueue.shift();
                assignTrackToSpeaker(nextItem.track, nextItem.pc, nextItem.eventObj);
            } else {
                updateStageLayout();
            }
        }

        function bootVisualizer() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            updateStageLayout();

            // 🟢 Poll continuously for VDO.Ninja label updates
            setInterval(() => {
                speakers.forEach(spk => {
                    if (spk.track && spk.track.readyState === 'ended') { 
                        handleTrackDisconnect(spk); 
                    } else if (spk.trackId && !spk.advMatch) {
                        updateSpeakerIdentity(spk);
                    }
                });
            }, 1000);

            setInterval(() => {
                try {
                    const iframeWin = vdoTransport.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);

                            pc.addEventListener('connectionstatechange', () => {
                                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                                    speakers.forEach(spk => { if (spk.pc === pc) handleTrackDisconnect(spk); });
                                    for (let i = waitingQueue.length - 1; i >= 0; i--) {
                                        if (waitingQueue[i].pc === pc) waitingQueue.splice(i, 1);
                                    }
                                }
                            });
                            
                            pc.addEventListener('track', async (event) => {
                                const track = event.track;
                                if (track.kind !== 'audio') return;
                                if (connectedTracks.has(track.id)) return;

                                const assigned = assignTrackToSpeaker(track, pc, event);
                                if (!assigned) {
                                    waitingQueue.push({ track: track, pc: pc, eventObj: event });
                                }
                            });
                            return pc;
                        };
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 500);

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderAudioBars();
        }

        const renderAudioBars = () => {
            requestAnimationFrame(renderAudioBars);

            speakers.forEach(spk => {
                if (spk.analyser && spk.dataArray) {
                    spk.analyser.getByteFrequencyData(spk.dataArray);
                    
                    let totalVolume = 0; 
                    for(let i=0; i<spk.bars.length; i++) { 
                        let val = Math.max(0, (spk.dataArray[i * 2 + 1] || 0) - 75); 
                        totalVolume += val;
                        
                        let height = 5 + (val * 0.25);
                        spk.bars[i].style.height = `${Math.min(35, height)}px`;
                    }
                    
                    let avgVol = totalVolume / spk.bars.length;
                    
                    if (avgVol > 5) {
                        spk.pod.classList.add('talking');
                    } else {
                        spk.pod.classList.remove('talking');
                    }
                } else {
                    spk.pod.classList.remove('talking');
                    spk.bars.forEach(bar => bar.style.height = '5px');
                }
            });
        };
        
        document.addEventListener('DOMContentLoaded', bootVisualizer);
    </script>
</body>
</html>
