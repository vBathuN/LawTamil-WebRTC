<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>LawTamil Dual-Core VTuber Pro (Host vs Guest Edition)</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; justify-content: flex-end;
            font-family: sans-serif;
        }

        /* 16:9 DUAL STAGE ARENA */
        .podcast-theatre {
            width: 100%; height: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 4vw; box-sizing: border-box;
        }

        .vtuber-pod {
            width: 42vw; max-width: 450px; 
            height: 85vh; max-height: 520px;
            position: relative;
            display: flex; flex-direction: column; align-items: center;
        }

        .anim-section { 
            width: 100%; height: 100%; position: relative; 
        }

        /* GUEST கேன்வாஸை கிடைமட்டமாகத் திருப்பும் மேஜிக் */
        .mirror-flip { transform: scaleX(-1); }

        .joker-canvas {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            will-change: transform;
            perspective: 800px;
        }

        /* Speaker ID Badges */
        .speaker-badge {
            position: absolute; bottom: -2vh;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.8vh 1.5vw; border-radius: 20px;
            color: white; font-size: 1vw; font-weight: bold;
            display: flex; align-items: center; gap: 0.5vw;
            backdrop-filter: blur(8px); z-index: 10;
        }

        .badge-host { border-bottom: 3px solid #ff1a1a; }
        .badge-guest { border-bottom: 3px solid #00ff66; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div class="podcast-theatre">
        <!-- 1. HOST (Left Side - Crimson Red) -->
        <div class="vtuber-pod">
            <div class="anim-section">
                <canvas id="stage-host" class="joker-canvas" width="420" height="480"></canvas>
            </div>
            <div class="speaker-badge badge-host">
                <span class="dot" style="background:#ff1a1a;"></span> HOST (ID: 1)
            </div>
        </div>

        <!-- 2. GUEST (Right Side - Toxic Acid Green & Mirrored) -->
        <div class="vtuber-pod">
            <div class="anim-section mirror-flip">
                <canvas id="stage-guest" class="joker-canvas" width="420" height="480"></canvas>
            </div>
            <div class="speaker-badge badge-guest">
                <span class="dot" style="background:#00ff66;"></span> GUEST (ID: 2)
            </div>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'JurisprudenceTamil';

        // --- 1. HEADLESS WEBRTC TRANSPORT ---
        const vdoTransport = document.createElement('iframe');
        vdoTransport.allow = "autoplay; microphone";
        vdoTransport.style.cssText = "position:absolute;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1";
        vdoTransport.src = `./index.html?scene&room=${roomName}&autostart&stereo&proaudio&vol=0`;
        document.body.appendChild(vdoTransport);

        let audioCtx; 
        let workletPromise = null; // Race-condition தடுப்பான்

        // --- 2. DUAL SPEAKER STATE ENCAPSULATION ---
        const speakers = [
            {
                id: 'Host',
                canvas: document.getElementById('stage-host'),
                ctx: document.getElementById('stage-host').getContext('2d'),
                filterStyle: 'none', // அசல் கிரிம்சன் ரெட்
                pColor: '#ff1a1a', sColor: '#ff4d4d', wColor1: '#9900cc', wColor2: '#cc33ff',
                currJaw: 0, targetJaw: 0, currSmile: 0, targetSmile: 0, 
                faceAlpha: 0.85, targetFaceAlpha: 0, lastActiveTime: Date.now() + 1500, // 1.5s Welcome Glow
                isBlinking: false, analyser: null, dataArray: null, trackId: null
            },
            {
                id: 'Guest',
                canvas: document.getElementById('stage-guest'),
                ctx: document.getElementById('stage-guest').getContext('2d'),
                filterStyle: 'hue-rotate(140deg) saturate(1.4)', // TOXIC ACID GREEN MAGIC!
                pColor: '#00ff66', sColor: '#33ff88', wColor1: '#00e5ff', wColor2: '#0088ff',
                currJaw: 0, targetJaw: 0, currSmile: 0, targetSmile: 0, 
                faceAlpha: 0.85, targetFaceAlpha: 0, lastActiveTime: Date.now() + 1500, // 1.5s Welcome Glow
                isBlinking: false, analyser: null, dataArray: null, trackId: null
            }
        ];

        const bgImg = new Image(); const fgImg = new Image();
        function loadWithFallback(imgObj, srcList) {
            let i = 0; imgObj.onerror = () => { i++; if (i < srcList.length) imgObj.src = srcList[i]; };
            imgObj.src = srcList[0];
        }
        loadWithFallback(bgImg, ['./joker.png', './joker.jpg', './joker.PNG', './joker.JPG']);
        loadWithFallback(fgImg, ['./joker1.png', './joker1.PNG']);

        // Contour ஸ்கேனிங் இருவருக்கும் பொதுவானது (CPU மெமரி சேமிப்பு)
        let contourNormals = []; let contourScanned = false;
        function safeScanContour() {
            if (contourScanned || !fgImg.complete || fgImg.naturalWidth === 0) return;
            try {
                const off = document.createElement('canvas'); off.width = 420; off.height = 480; 
                const octx = off.getContext('2d', { willReadFrequently: true });
                octx.drawImage(fgImg, 0, 0, fgImg.naturalWidth, fgImg.naturalHeight, 60, 40, 300, 340);
                const data = octx.getImageData(0, 0, 420, 480).data;
                const cx = 210, cy = 210; const rays = 75; contourNormals = [];
                for (let i = 0; i < rays; i++) {
                    const angle = (i / rays) * (Math.PI * 2);
                    if (angle > Math.PI * 0.35 && angle < Math.PI * 0.65) continue;
                    const nx = Math.cos(angle); const ny = Math.sin(angle);
                    for (let r = 165; r > 15; r--) {
                        const px = Math.round(cx + nx * r); const py = Math.round(cy + ny * r);
                        if (px >= 0 && px < 420 && py >= 0 && py < 480) {
                            if (data[(py * 420 + px) * 4 + 3] > 40) { contourNormals.push({ x: px, y: py, nx: nx, ny: ny }); break; }
                        }
                    }
                }
                contourScanned = true;
            } catch (e) { contourScanned = true; }
        }

        const AudioBlendshapeNet = {
            predict: function(fft) {
                let x = []; for(let i=0; i<16; i++) { x[i] = Math.max(0, (fft[i] || 0) - 78) / 177; }
                const f1Vowel = (x[1]*1.0 + x[2]*1.5 + x[3]*1.8 + x[4]*1.2 + x[5]*0.7) / 6.2;
                const f2Sibilant = (x[9]*0.8 + x[11]*1.4 + x[13]*1.7 + x[15]*1.1) / 5.0;
                let jawOpen = Math.min(1.0, Math.max(0.0, (f1Vowel * 1.7) - 0.05));
                let mouthStretch = Math.min(1.0, Math.max(0.0, (f2Sibilant * 1.6) - (f1Vowel * 0.4)));
                return { jawOpen, mouthStretch };
            }
        };

        // இருவருக்கும் தனித்தனியான Autonomous Blink லூப்
        function scheduleBlink(spk) {
            spk.isBlinking = true; setTimeout(() => { spk.isBlinking = false; }, 120);
            setTimeout(() => scheduleBlink(spk), Math.random() * 3500 + 2000);
        }
        speakers.forEach(spk => scheduleBlink(spk));

        // --- 3. உங்களின் அசல் DSP KERNEL (0% Unmodified) ---
        const pitchWorkletCode = `
    class TrueGranularEngine extends AudioWorkletProcessor {
        constructor() {
            super();
            this.GRAIN = 1024; // 21ms Hanning Window
            this.buffer = new Float32Array(this.GRAIN * 4);
            this.wPtr = 0;
            this.headA = { pos: 0, age: 0 };
            this.headB = { pos: 0, age: this.GRAIN / 2 }; 
            this.pitch = 0.817; // உங்களின் கோல்டன் ரேஷியோ
        }
        getSample(ptr) {
            let fl = Math.floor(ptr); let fr = ptr - fl;
            let s0 = this.buffer[fl % (this.GRAIN * 4)]; let s1 = this.buffer[(fl + 1) % (this.GRAIN * 4)];
            return s0 + (s1 - s0) * fr;
        }
        process(inputs, outputs) {
            const input = inputs[0][0]; const outputL = outputs[0][0]; const outputR = outputs[0][1];
            if (!input || !outputL) return true;
            const N = this.GRAIN; const maxBuf = N * 4;
            for (let i = 0; i < input.length; i++) {
                this.buffer[this.wPtr] = input[i]; this.wPtr = (this.wPtr + 1) % maxBuf;
                let winA = 0.5 * (1 - Math.cos((2 * Math.PI * this.headA.age) / N));
                let winB = 0.5 * (1 - Math.cos((2 * Math.PI * this.headB.age) / N));
                let sample = (this.getSample(this.headA.pos) * winA) + (this.getSample(this.headB.pos) * winB);
                outputL[i] = sample; if (outputR) outputR[i] = sample;
                this.headA.age++; this.headB.age++;
                this.headA.pos = (this.headA.pos + this.pitch) % maxBuf; this.headB.pos = (this.headB.pos + this.pitch) % maxBuf;
                if (this.headA.age >= N) { this.headA.age = 0; this.headA.pos = (this.wPtr - N + maxBuf) % maxBuf; }
                if (this.headB.age >= N) { this.headB.age = 0; this.headB.pos = (this.wPtr - N + maxBuf) % maxBuf; }
            }
            return true;
        }
    }
    registerProcessor('joker-voice-engine', TrueGranularEngine);
    `;

        const connectedTracks = new Map();

        function bootVisualizer() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            setInterval(() => {
                try {
                    const iframeWin = vdoTransport.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            pc.addEventListener('track', async (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    
                                    // காலியாக உள்ள முதல் ஸ்பீக்கர் ஸ்லாட்டைக் கண்டுபிடி
                                    let availSpeaker = speakers.find(s => s.trackId === null);
                                    if (availSpeaker) {
                                        availSpeaker.trackId = track.id;
                                        connectedTracks.set(track.id, availSpeaker);

                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        
                                        // இந்த குறிப்பிட்ட நபருக்கான பிரத்யேக Analyser
                                        availSpeaker.analyser = audioCtx.createAnalyser();
                                        availSpeaker.analyser.fftSize = 128; availSpeaker.analyser.smoothingTimeConstant = 0.3;
                                        availSpeaker.dataArray = new Uint8Array(availSpeaker.analyser.frequencyBinCount);

                                        const cleanStream = new MediaStream([track]);
                                        const rawMic = audioCtx.createMediaStreamSource(cleanStream);

                                        if (!workletPromise) {
                                            const blob = new Blob([pitchWorkletCode], { type: 'application/javascript' });
                                            workletPromise = audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
                                        }
                                        await workletPromise;

                                        const pitchConverter = new AudioWorkletNode(audioCtx, 'joker-voice-engine');
                                        const chestRumble = audioCtx.createBiquadFilter();
                                        chestRumble.type = 'lowshelf'; chestRumble.frequency.value = 160; chestRumble.gain.value = 6.0; 

                                        rawMic.connect(chestRumble);
                                        chestRumble.connect(pitchConverter);
                                        pitchConverter.connect(availSpeaker.analyser);
                                        availSpeaker.analyser.connect(audioCtx.destination);

                                        // நபர் டிஸ்கனெக்ட் ஆனால் ஸ்லாட்டை ரிலீஸ் செய்
                                        track.onended = () => {
                                            availSpeaker.trackId = null; availSpeaker.analyser = null; availSpeaker.dataArray = null;
                                            connectedTracks.delete(track.id);
                                        };
                                    }
                                }
                            });
                            return pc;
                        };
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 500);

            setInterval(() => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, 1000);
            renderTheatre();
        }

        // --- 4. THE DUAL RENDER LOOP ---
        const renderTheatre = () => {
            requestAnimationFrame(renderTheatre);
            if (!contourScanned && fgImg.complete && fgImg.naturalWidth > 0) safeScanContour();

            speakers.forEach(spk => {
                let avgVol = 0; let whisperLevel = 0; let blendshapes = { jawOpen: 0, mouthStretch: 0 };
                
                if (spk.analyser && spk.dataArray) {
                    spk.analyser.getByteFrequencyData(spk.dataArray);
                    let totalVolume = 0; for(let i=0; i<25; i++) { totalVolume += Math.max(0, (spk.dataArray[i] || 0) - 82); }
                    avgVol = totalVolume / 25; blendshapes = AudioBlendshapeNet.predict(spk.dataArray);

                    let highFreqSum = 0; for(let k=12; k<22; k++) { highFreqSum += spk.dataArray[k]; }
                    whisperLevel = highFreqSum / 10;
                }

                let lookSideAngle = Math.sin(Date.now() * 0.002) * 2.5;
                let glitchX = 0;

                if (avgVol > 8) { 
                    spk.lastActiveTime = Date.now(); spk.targetFaceAlpha = 1.0; 
                    spk.targetJaw = blendshapes.jawOpen * 22; spk.targetSmile = blendshapes.mouthStretch * 12; 
                    if (avgVol > 35) { glitchX = (Math.random() - 0.5) * 6; }
                } else {
                    spk.targetJaw = 0; spk.targetSmile = 0;
                    if (Date.now() - spk.lastActiveTime > 1200) spk.targetFaceAlpha = 0.0; 
                }

                spk.canvas.style.transform = `translate(-50%, -50%) rotateY(${lookSideAngle}deg) translateX(${glitchX}px)`;

                if (bgImg.complete && fgImg.complete && bgImg.naturalHeight > 0 && fgImg.naturalHeight > 0) {
                    spk.currJaw += (spk.targetJaw - spk.currJaw) * 0.32; spk.currSmile += (spk.targetSmile - spk.currSmile) * 0.28;
                    spk.faceAlpha += (spk.targetFaceAlpha - spk.faceAlpha) * 0.14; 
                    
                    spk.ctx.clearRect(0, 0, 420, 480);
                    spk.ctx.save();

                    // TOXIC GREEN ஃபில்டரை அப்ளை செய்யும் இடம்
                    if (spk.filterStyle !== 'none') spk.ctx.filter = spk.filterStyle;

                    spk.ctx.globalAlpha = 1.0;
                    spk.ctx.drawImage(bgImg, 0, 0, bgImg.naturalWidth, bgImg.naturalHeight, 60, 40, 300, 340);

                    if (spk.faceAlpha > 0.005) {
                        spk.ctx.globalAlpha = spk.faceAlpha;
                        
                        // கம்பிகள் வரையும்போது ஃபில்டரை ஆஃப் செய்கிறோம் (அப்போதுதான் கம்பியின் ஒரிஜினல் நியான் பச்சை பிரகாசிக்கும்)
                        if (contourNormals.length > 0 && avgVol > 1) {
                            spk.ctx.save(); spk.ctx.filter = 'none'; 
                            spk.ctx.lineWidth = 3.5; spk.ctx.lineCap = 'round';
                            
                            let primaryColor = spk.pColor; let secondaryColor = spk.sColor;
                            if (avgVol < 12 && whisperLevel > 50) { primaryColor = spk.wColor1; secondaryColor = spk.wColor2; }

                            spk.ctx.shadowColor = primaryColor; spk.ctx.shadowBlur = 12;
                            const stepBin = Math.floor((spk.dataArray.length * 0.6) / contourNormals.length);
                            contourNormals.forEach((pt, i) => {
                                const bin = i * stepBin; const pwr = Math.max(0, (spk.dataArray[bin] || 0) - 85) * 0.25;
                                if (pwr > 1) {
                                    spk.ctx.strokeStyle = (i % 2 === 0) ? primaryColor : secondaryColor;
                                    spk.ctx.beginPath(); spk.ctx.moveTo(pt.x - (pt.nx * 2), pt.y - (pt.ny * 2));
                                    spk.ctx.lineTo(pt.x + (pt.nx * pwr), pt.y + (pt.ny * pwr)); spk.ctx.stroke();
                                }
                            });
                            spk.ctx.restore();
                        }
                        const natW = fgImg.naturalWidth; const natH = fgImg.naturalHeight; const scale = 340 / natH; 
                        const sTop = natH * 0.585; const sBot = natH * 0.625; const sRubberH = sBot - sTop; 
                        const dTopH = sTop * scale; const dRubberH = (sRubberH * scale) + spk.currJaw; 
                        const dBotY = dTopH + dRubberH; const dBotH = (natH - sBot) * scale;
                        const stretchX = 60 - (spk.currSmile * 0.5); const stretchW = 300 + spk.currSmile;
                        const botJawX = 60 - (spk.currSmile * 0.25);

                        spk.ctx.drawImage(fgImg, 0, 0, natW, sTop,  60, 40, 300, dTopH);
                        spk.ctx.drawImage(fgImg, 0, sTop, natW, sRubberH,  stretchX, 40 + dTopH, stretchW, dRubberH);
                        spk.ctx.drawImage(fgImg, 0, sBot, natW, natH - sBot,  botJawX, 40 + dBotY, 300 + (spk.currSmile*0.5), dBotH);
                    }
                    spk.ctx.restore(); // ஃபில்டர் க்ளியர்

                    if (spk.isBlinking) {
                        spk.ctx.fillStyle = "#cbd0d3"; 
                        spk.ctx.beginPath(); spk.ctx.ellipse(184.5, 179.4, 14, 8, 0, 0, Math.PI*2); spk.ctx.fill();
                        spk.ctx.beginPath(); spk.ctx.ellipse(235.5, 179.4, 14, 8, 0, 0, Math.PI*2); spk.ctx.fill();
                    }
                }
            });
        };
        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
