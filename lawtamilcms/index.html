<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
	<meta content="utf-8" http-equiv="encoding" />
	<title>LawTamil Voice Studio</title>
	
	<style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #0f172a;
            display: flex;
            flex-direction: column; /* லோகோ மற்றும் டெக்ஸ்டை வரிசைப்படுத்த */
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .output, button { 
            display: none !important; 
        }

        /* லோகோ பட்டன் (Clickable) */
        .mic-status-container {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer; /* கிளிக் செய்யும் உணர்வைத் தர */
        }

        .lawtamil-logo {
            width: 120px;
            height: auto;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        /* மைக் ஆன் அனிமேஷன் */
        .is-listening {
            animation: pulse-glow 1.5s infinite;
            background-color: #1e3a8a;
        }

        /* மைக் ஆஃப் ஆகும் போது மங்கலாக்க (Dim) */
        .is-muted {
            opacity: 0.4;
            filter: grayscale(50%);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* ஸ்டேட்டஸ் டெக்ஸ்ட் */
        #status-text {
            margin-top: 30px;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #3b82f6;
            transition: color 0.3s ease;
        }
	</style>
</head>
<body>
	
    <div id="mic-indicator" class="mic-status-container" onclick="toggleMic()">
        <img src="https://ul.lawtamil.in/logo.webp" alt="LawTamil Mic" class="lawtamil-logo" id="logo-img">
    </div>

    <div id="status-text">மைக் ஆன் (நிறுத்தத் தொடவும்)</div>

    <div style="display: none !important;">
        <a id="shareLink" href="#"></a>
        <div id="interm" class="output"></div>
        <div id="output" class="output"></div>
    </div>
	
	<script>
	function download(filename, text) {
	  var element = document.createElement('a');
	  element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
	  element.setAttribute('download', filename);
	  element.style.display = 'none';
	  document.body.appendChild(element);
	  element.click();
	  document.body.removeChild(element);
	}
	
	function getOldStorage() {
		var values = [], keys = Object.keys(localStorage), i = keys.length;
		while ( i-- ) { values.push( localStorage.getItem(keys[i]) ); }
		return values;
	}
	
	function removeStorage(cname){
		localStorage.removeItem(cname);
	}

	function setStorage(cname, cvalue, exdays=999){ 
		var now = new Date();
		var item = { value: cvalue, expiry: now.getTime() + (exdays * 24 * 60 * 60 * 1000) };
		try{ localStorage.setItem(cname, JSON.stringify(item)); }catch(e){console.error(e);}
	}

	function getStorage(cname) {
		try { var itemStr = localStorage.getItem(cname); } catch(e){ return; }
		if (!itemStr) return "";
		var item = JSON.parse(itemStr);
		var now = new Date();
		if (now.getTime() > item.expiry) { localStorage.removeItem(cname); return ""; }
		return item.value;
	}
	
	function updateURL(param, force=false) {
		var para = param.split('='); 
		if (!(urlParams.has(para[0].toLowerCase()))){
			if (history.pushState){
				var arr = window.location.href.split('?');
				var newurl = (arr.length > 1 && arr[1] !== '') ? window.location.href + '&' +param : window.location.href + '?' +param;
				window.history.pushState({path:newurl},'',newurl);
			}
		} else if (force){
			if (history.pushState){
				var href = new URL(window.location.href);
				if (para.length==1) href.searchParams.set(para[0].toLowerCase(), "");
				else href.searchParams.set(para[0].toLowerCase(), para[1]);
				window.history.pushState({path:href.toString()},'',href.toString());
			}
		}
	}

	(function (w) {
		w.URLSearchParams = w.URLSearchParams || function (searchString) {
			var self = this;
			self.searchString = searchString;
			self.get = function (name) {
				var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(self.searchString);
				return results == null ? null : decodeURI(results[1]) || 0;
			};
		};
	})(window);
	
	var urlParams = new URLSearchParams(window.location.search);
	var sanitize = function(string) {
		var temp = document.createElement('div');
		temp.innerText = string;
		temp.innerText = temp.innerHTML;
		temp = temp.textContent || temp.innerText || "";
		return temp.substring(0, Math.min(temp.length, 500)).trim();
	};
	
	function generateStreamID(){
		var text = "", possible = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
		for (var i = 0; i < 7; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
		return text;
	};
	
	var roomID = "test";
	if (urlParams.has("room")) roomID = urlParams.get("room");
	else if (urlParams.has("ROOM")) roomID = urlParams.get("ROOM");
	else { roomID = generateStreamID(); updateURL("room="+roomID); }
	
	var label = urlParams.has("label") ? urlParams.get("label") : false;
	var myLang = urlParams.has("lang") ? urlParams.get("lang") : "en-US";
	if (!urlParams.has("lang")) updateURL("lang="+myLang);
	
	var srtFile = "", timestamp_start = null, timestamp_stop = null, timestamp_intern = null, logcounter=0, counter=0;
	var url = document.URL.substr(0,document.URL.lastIndexOf('/'));
	
	var oldSaves = Object.keys(localStorage);
	if (oldSaves.length){
		for (var i =0;i<oldSaves.length;i++){
			if (oldSaves.length - 1== i){
				if (oldSaves[i].startsWith("transcription_"+roomID+"_")){
					try {
						var button = document.createElement("button");
						button.onclick = function(){
							var srtFile = getStorage(this.dataset.key);
							download(this.dataset.key+".srt", srtFile);
							localStorage.removeItem(this.dataset.key);
						};
						button.dataset.key = oldSaves[i];
						button.innerHTML = "Download previous saved transcription";
						document.body.prepend(button);
					}catch(e){}
				}
			} else if (oldSaves[i].startsWith("transcription_"+roomID+"_")) localStorage.removeItem(i);
		}
	}
	
	document.getElementById("shareLink").href= url+"/overlay?room="+roomID;
	
	var apiKey = false;
	var socket = new WebSocket("wss://api.caption.ninja:443");
	if (urlParams.has("pie")){
		apiKey = urlParams.get("pie") || "0khtlN7R7ISHZzFiyfK49Q9zAm93Wti5xpbW9qjg";
		socket = new WebSocket("wss://free3.piesocket.com/v3/"+roomID+"?api_key="+apiKey);
		document.getElementById("shareLink").href= url+"/overlay?room="+roomID+"&pie="+apiKey;
	} 
		
	socket.onclose = function (){ setTimeout(function(){window.location.reload(true);},100); };
	socket.onopen = function (){ socket.send(JSON.stringify({"join":roomID})); }
	
	// On/Off கட்டுப்பாட்டிற்கான புதிய லாஜிக்
	var isMicActive = true; 
	var recognition = null; // உலகளாவிய மாறி (Global variable)

	function toggleMic() {
	    isMicActive = !isMicActive;
	    var indicator = document.getElementById('mic-indicator');
	    var logoImg = document.getElementById('logo-img');
	    var statusText = document.getElementById('status-text');

	    if (isMicActive) {
	        // மைக் ஆன்
	        logoImg.classList.remove('is-muted');
	        statusText.innerText = "மைக் ஆன் (நிறுத்தத் தொடவும்)";
	        statusText.style.color = "#3b82f6";
	        setup();
	    } else {
	        // மைக் ஆஃப்
	        logoImg.classList.add('is-muted');
	        indicator.classList.remove('is-listening');
	        statusText.innerText = "மைக் ஆஃப் (தொடங்கத் தொடவும்)";
	        statusText.style.color = "#ef4444";
	        if (recognition) {
	            recognition.stop();
	        }
	    }
	}

	var ends = 0, final_transcript = '', interim_transcript = "", idle = null;
	setup();
	
	function setup(){
	    if (!isMicActive) return; // பயனர் ஆஃப் செய்திருந்தால் தொடங்காது

		if ('webkitSpeechRecognition' in window){
			recognition = new webkitSpeechRecognition();
			if (myLang) recognition.lang = myLang;
			recognition.continuous = true;
			recognition.interimResults = true;
			
			recognition.onstart = function(){
			    if (isMicActive) {
				    document.getElementById('mic-indicator').classList.add('is-listening');
				}
				setTimeout(function(){ ends = 0; }, 2000);
			};
			
			recognition.onerror = function(event){ 
			    console.log(event); 
			};
			
			recognition.onend = function(e){
				document.getElementById('mic-indicator').classList.remove('is-listening');
				if (event.type === "end") ends +=1;
				if (ends > 3 && isMicActive) alert("WARNING: Transcription service failed.");
				
				// பயனர் மேனுவலாக ஆஃப் செய்யாத வரை, ஆட்டோ-ரீஸ்டார்ட் செய்யும்
				if (isMicActive) {
				    setup();
				}
			};
			
			recognition.onresult = function(event){
				counter+=1;
				var interim_transcript = '';
				if(typeof(event.results) == 'undefined') return;
				
				for(var i = event.resultIndex; i < event.results.length; ++i){
					if(event.results[i].isFinal) final_transcript += sanitize(event.results[i][0].transcript);
					else interim_transcript += sanitize(event.results[i][0].transcript);
				}
				
				if (final_transcript){
					document.getElementById("output").innerHTML+="<span id='final_"+counter+"'>"+final_transcript+"</span><br />";
					document.getElementById("interm").innerHTML="";
					
					try {
						if (label) socket.send(JSON.stringify({"msg":true, "final":final_transcript, "id":counter, "label":label, "ln": myLang}));
						else socket.send(JSON.stringify({"msg":true, "final":final_transcript, "id":counter, "ln": myLang}));
						final_transcript=""; interim_transcript="";
					} catch(e){}
				} else {
					document.getElementById("interm").innerHTML="<span>"+interim_transcript+"</span><br />";
					try {
						if (label) socket.send(JSON.stringify({"msg":true, "interm":interim_transcript, "id":counter, "label":label, "ln": myLang}));
						else socket.send(JSON.stringify({"msg":true, "interm":interim_transcript, "id":counter, "ln": myLang}));
					} catch(e){ interim_transcript=""; }
				}
			};
			recognition.start();
		}
	}
	</script>
</body>
</html>
