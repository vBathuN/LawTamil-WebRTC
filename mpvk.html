<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>மூட்டைப் பூச்சி WebRTC Voice Overlay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background-image:url("https://ul.lawtamil.in/bg.jpg?v=1.1");
  background-size:cover;background-position:center;
  color:#fff;font-family:"Segoe UI",Tahoma,sans-serif;
}
.stage{
  width:100vw;height:100vh;position:relative;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;
}
.character{
  position:absolute;left:50%;bottom:-1vh;
  width:min(72vw,860px);
  height:auto;
  aspect-ratio:1024/1215;
  transform:translateX(-50%);
  transform-origin:50% 100%;
  will-change:transform;
}
#actorCanvas{display:block;width:100%;height:100%}
.badge{
  position:absolute;left:50%;bottom:1.5vh;transform:translateX(-50%);
  padding:.75rem 1.2rem;border-radius:12px;
  background:rgba(15,23,42,.92);border:2px solid rgba(255,255,255,.85);
  border-bottom:6px solid #b90000;box-shadow:0 10px 30px rgba(0,0,0,.55);
  font-size:clamp(18px,2.1vw,30px);font-weight:900;white-space:nowrap;
  z-index:20;
}
.badge .dot{
  display:inline-block;width:.8em;height:.8em;border-radius:50%;
  background:#ff1a1a;margin-right:.45em;vertical-align:middle;
}
.status{
  position:absolute;top:1rem;left:1rem;z-index:30;
  padding:.45rem .7rem;border-radius:8px;
  background:rgba(0,0,0,.55);font-size:12px;color:#ddd;
}
@media (orientation:portrait){
  .character{width:min(92vw,760px);bottom:0}
  .badge{display:none}
}
</style>
</head>
<body>

<div class="stage">
  <div class="status" id="status">WebRTC audio: waiting…</div>
  <div class="character">
    <canvas id="actorCanvas" width="1024" height="1215"></canvas>
  </div>
  <div class="badge"><span class="dot"></span>கருத்து கந்தன்</div>
</div>

<iframe id="rtcTransport"
  allow="autoplay; microphone"
  style="position:absolute;width:1px;height:1px;opacity:.01;pointer-events:none;border:0"
  title="WebRTC transport"></iframe>

<script>
(() => {
  "use strict";

  /* ============================================================
     FILES
     ------------------------------------------------------------
     Put these two PNGs beside this HTML file:
       mpvk.png  = full character + chair
       mpvk1.png = head/face layer only
     Both uploaded images are 1024 × 1215 RGBA PNGs.
     mpvk1's visible head ends around source Y = 547.
     ============================================================ */
  const BODY_SRC = "./mpvk.png";
  const HEAD_SRC = "./mpvk1.png";

  const canvas = document.getElementById("actorCanvas");
  const ctx = canvas.getContext("2d", { alpha:true });
  const statusEl = document.getElementById("status");

  const bodyImg = new Image();
  const headImg = new Image();

  let audioCtx = null;
  let analyser = null;
  let timeData = null;
  let freqData = null;

  const state = {
    jaw: 0,
    targetJaw: 0,
    blink: 0,
    blinkTarget: 0,
    nextBlink: 0,
    speaking: false,
    lastAudio: 0,
    audioLevel: 0
  };

  // ---- Source coordinates measured from the supplied 1024×1215 artwork ----
  // The head-only PNG visibly occupies Y ≈ 0..547.
  const SRC_W = 1024;
  const SRC_H = 1215;

  // Head / eye / mouth geometry for mpvk1.png.
  const HEAD_BOTTOM = 548;
  const JAW_PIVOT_Y = 405;     // begins moving around the mouth/jaw
  const JAW_MAX_OPEN = 34;     // maximum downward movement in source pixels
  const JAW_MAX_STRETCH = 0.20;
  const EYE_L = { x: 430, y: 355, rx: 52, ry: 31, rot: 0.08 };
  const EYE_R = { x: 600, y: 355, rx: 52, ry: 31, rot:-0.08 };

  function load(img, src){
    return new Promise((resolve,reject)=>{
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  /*
   * Remove the head from the full-body base by using the alpha of
   * mpvk1.png. This prevents a "ghost jaw" from remaining underneath
   * the animated head.
   */
  function drawBodyWithoutHead(){
    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(bodyImg, 0, 0, SRC_W, SRC_H);

    // Erase only pixels occupied by the head-layer artwork.
    // This keeps the chair visible around the insect head.
    const mask = document.createElement("canvas");
    mask.width = SRC_W; mask.height = SRC_H;
    const mctx = mask.getContext("2d", { willReadFrequently:true });
    mctx.drawImage(headImg,0,0,SRC_W,SRC_H);

    ctx.globalCompositeOperation = "destination-out";
    ctx.drawImage(mask,0,0);
    ctx.restore();
  }

  function drawHead(){
    const jaw = state.jaw;
    const lowerH = HEAD_BOTTOM - JAW_PIVOT_Y;
    const scaleY = 1 + (jaw / JAW_MAX_OPEN) * JAW_MAX_STRETCH;

    // Upper head stays completely stable.
    ctx.drawImage(
      headImg,
      0, 0, SRC_W, JAW_PIVOT_Y,
      0, 0, SRC_W, JAW_PIVOT_Y
    );

    // Lower mouth/jaw section stretches downward.
    const dstH = lowerH * scaleY;
    ctx.drawImage(
      headImg,
      0, JAW_PIVOT_Y, SRC_W, lowerH,
      0, JAW_PIVOT_Y, SRC_W, dstH
    );

    /*
     * Extra controlled jaw drop. The mouth in the source image is already
     * slightly open, so a modest vertical move looks more natural than
     * a huge rubber-mouth deformation.
     */
    if (jaw > 2) {
      const pull = Math.min(jaw * 0.28, 10);
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.translate(0, pull);
      ctx.drawImage(
        headImg,
        0, JAW_PIVOT_Y + 12, SRC_W, HEAD_BOTTOM - (JAW_PIVOT_Y + 12),
        0, JAW_PIVOT_Y + 12, SRC_W, HEAD_BOTTOM - (JAW_PIVOT_Y + 12)
      );
      ctx.restore();
    }
  }

  function drawBlink(){
    if(state.blink <= 0.01) return;

    const k = state.blink;
    ctx.save();

    // Warm/dark chitin-like eyelids, placed over the real eye geometry.
    ctx.fillStyle = `rgba(62,25,5,${0.96*k})`;
    ctx.strokeStyle = `rgba(170,92,28,${0.8*k})`;
    ctx.lineWidth = 5;

    for(const e of [EYE_L,EYE_R]){
      ctx.save();
      ctx.translate(e.x,e.y);
      ctx.rotate(e.rot);

      ctx.beginPath();
      ctx.ellipse(0,0,e.rx,e.ry,0,0,Math.PI*2);
      ctx.fill();

      // Small curved highlight/eyelid seam so the blink reads as a closing eye.
      ctx.beginPath();
      ctx.moveTo(-e.rx*0.72,0);
      ctx.quadraticCurveTo(0,e.ry*0.20,e.rx*0.72,0);
      ctx.stroke();

      ctx.restore();
    }
    ctx.restore();
  }

  function scheduleBlink(){
    const delay = 2200 + Math.random()*4200;
    setTimeout(() => {
      // Fast close, brief closed state, quick reopen.
      state.blinkTarget = 1;
      setTimeout(() => state.blinkTarget = 0, 110);
      scheduleBlink();
    }, delay);
  }

  /*
   * Better audio analysis:
   * - time-domain RMS catches speech consistently
   * - low/mid frequency energy helps distinguish vowels
   * - smoothing prevents choppy one-frame jaw movement
   */
  function readAudio(){
    if(!analyser || !timeData || !freqData) return 0;

    analyser.getByteTimeDomainData(timeData);
    analyser.getByteFrequencyData(freqData);

    let sum = 0;
    for(let i=0;i<timeData.length;i++){
      const v = (timeData[i]-128)/128;
      sum += v*v;
    }
    const rms = Math.sqrt(sum/timeData.length);

    let low=0, mid=0;
    const n=freqData.length;
    for(let i=0;i<n;i++){
      const v=freqData[i]/255;
      if(i < n*0.18) low += v;
      else if(i < n*0.55) mid += v;
    }
    low /= Math.max(1,n*0.18);
    mid /= Math.max(1,n*0.37);

    // Speech energy model; intentionally capped because the image mouth
    // should remain believable, not open to an exaggerated cartoon jaw.
    const speech = Math.min(1, rms*4.4 + low*0.38 + mid*0.25);
    return speech;
  }

  function attachRemoteAudio(track){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.72;
      timeData = new Uint8Array(analyser.fftSize);
      freqData = new Uint8Array(analyser.frequencyBinCount);

      const stream = new MediaStream([track]);
      const source = audioCtx.createMediaStreamSource(stream);

      // One analyser branch for lipsync + one audible branch for playback.
      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      statusEl.textContent = "WebRTC audio: connected";
      statusEl.style.color = "#9cff9c";
    }catch(err){
      console.error("Audio attach failed:", err);
      statusEl.textContent = "WebRTC audio: analyser error";
    }
  }

  function handleRemoteTrack(track){
    if(track.kind !== "audio") return;
    attachRemoteAudio(track);
  }

  /*
   * Hook the same-origin VDO.Ninja/WebRTC iframe used by your original
   * page. This keeps the existing room parameter behaviour.
   */
  function bootWebRTC(){
    const params = new URLSearchParams(location.search);
    const room = params.get("room") || "JurisprudenceTamil";

    const rtcFrame = document.getElementById("rtcTransport");
    rtcFrame.src =
      `./index.html?scene&room=${encodeURIComponent(room)}&autostart&stereo&proaudio&vol=0`;

    const timer = setInterval(() => {
      try{
        const win = rtcFrame.contentWindow;
        if(!win || !win.RTCPeerConnection || win.__mpvkHooked) return;

        const OriginalPC = win.RTCPeerConnection;

        win.RTCPeerConnection = function(...args){
          const pc = new OriginalPC(...args);

          pc.addEventListener("track", ev => {
            if(ev.track && ev.track.kind === "audio"){
              handleRemoteTrack(ev.track);
            }
          });

          pc.addEventListener("connectionstatechange", () => {
            if(["disconnected","failed","closed"].includes(pc.connectionState)){
              statusEl.textContent = "WebRTC audio: disconnected";
              statusEl.style.color = "#ffb0b0";
            }
          });

          return pc;
        };

        win.RTCPeerConnection.prototype = OriginalPC.prototype;
        Object.assign(win.RTCPeerConnection, OriginalPC);
        win.__mpvkHooked = true;
        clearInterval(timer);
      }catch(err){
        // Same-origin access may take a moment while iframe loads.
      }
    }, 250);
  }

  function render(now){
    requestAnimationFrame(render);

    // Smooth animation values.
    state.jaw += (state.targetJaw - state.jaw) * 0.24;
    state.blink += (state.blinkTarget - state.blink) * 0.60;

    ctx.clearRect(0,0,SRC_W,SRC_H);

    if(bodyImg.complete && headImg.complete){
      drawBodyWithoutHead();
      drawHead();
      drawBlink();
    }

    const speech = readAudio();
    state.audioLevel += (speech - state.audioLevel) * 0.22;

    const talking = state.audioLevel > 0.07;
    state.speaking = talking;

    if(talking){
      // Natural variation: jaw follows speech intensity but never snaps.
      const variation = 0.82 + 0.18*Math.sin(now*0.021);
      state.targetJaw = Math.min(JAW_MAX_OPEN, state.audioLevel * 42 * variation);
      state.lastAudio = now;
    }else{
      // Close gently after speech.
      state.targetJaw = Math.max(0, state.targetJaw - 1.6);
    }
  }

  Promise.all([load(bodyImg,BODY_SRC),load(headImg,HEAD_SRC)])
    .then(() => {
      // Sanity check: the supplied files should be 1024×1215 RGBA images.
      if(bodyImg.naturalWidth !== 1024 || bodyImg.naturalHeight !== 1215 ||
         headImg.naturalWidth !== 1024 || headImg.naturalHeight !== 1215){
        console.warn("Unexpected MPVK image dimensions:",
          bodyImg.naturalWidth,bodyImg.naturalHeight,
          headImg.naturalWidth,headImg.naturalHeight);
      }
      scheduleBlink();
      bootWebRTC();
      requestAnimationFrame(render);
    })
    .catch(err => {
      console.error(err);
      statusEl.textContent = "mpvk.png / mpvk1.png load failed";
      statusEl.style.color = "#ffb0b0";
    });

})();
</script>
</body>
</html>
